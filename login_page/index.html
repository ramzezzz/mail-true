<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network Controller</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Dark "particle + wireframe globe" enterprise login (front-end only).
    Everything visual is generated in code: CSS gradient background, a canvas
    constellation that follows the mouse, and a CSS-3D wireframe globe.
    No bitmap assets, no vendor branding. Editable text / colors / behavior
    live in the CONFIG object at the top of app.js.
  -->
  <div id="page" class="page">

    <!-- ============ Background constellation canvas (mouse-reactive) ============ -->
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>

    <!-- Soft bokeh glows (pure CSS, behind everything) -->
    <div class="bokeh bokeh--blue"  aria-hidden="true"></div>
    <div class="bokeh bokeh--orange" aria-hidden="true"></div>

    <!-- ============ Left: CSS-3D wireframe globe with orbiting icon nodes ============ -->
    <section class="globe-stage" id="globeStage" aria-hidden="true">
      <div class="aura"></div>
      <!-- The tilted sphere spins; rings AND the glowing balls live inside it so
           the balls travel ALONG the wireframe rings. Both filled in by app.js. -->
      <div class="globe" id="globe">
        <div class="globe__rings" id="globeRings"></div>
        <div class="globe__balls" id="globeBalls"></div>
      </div>
      <!-- Static overlay: pulsing icon nodes + center node (do NOT rotate). -->
      <div class="globe-fx">
        <div class="orbit" id="orbit"></div>
        <div class="node node--center">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="7" cy="8" r="2.4"/><circle cx="17" cy="8" r="2.4"/>
            <circle cx="12" cy="16" r="2.6"/>
            <path d="M7 8 12 16 17 8" fill="none" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- ============ Right: white login card ============ -->
    <section class="panel">
      <div class="card" id="card">

        <!-- Language toggle (top-right of card) -->
        <nav class="lang" aria-label="Language selection">
          <button type="button" class="lang__btn" data-lang="en" id="langEn">EN</button>
          <span class="lang__sep"></span>
          <button type="button" class="lang__btn" data-lang="zh" id="langZh">中</button>
        </nav>

        <!-- Brand: generic inline molecule logo + product name -->
        <div class="brand">
          <svg class="brand__logo" id="brandLogo" viewBox="0 0 40 40" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2">
              <line x1="20" y1="20" x2="9"  y2="11"/>
              <line x1="20" y1="20" x2="31" y2="12"/>
              <line x1="20" y1="20" x2="12" y2="31"/>
              <line x1="20" y1="20" x2="30" y2="30"/>
            </g>
            <g fill="currentColor">
              <circle cx="20" cy="20" r="5"/>
              <circle cx="9"  cy="11" r="3.2"/>
              <circle cx="31" cy="12" r="3.2" opacity="0.75"/>
              <circle cx="12" cy="31" r="3.2" opacity="0.75"/>
              <circle cx="30" cy="30" r="3.2" opacity="0.6"/>
            </g>
          </svg>
          <span class="brand__name" id="brandName"></span>
        </div>

        <form class="form" id="loginForm" novalidate autocomplete="off">

          <!-- Username (underline style) -->
          <div class="field">
            <label class="field__label" id="lblUser" for="username"></label>
            <div class="uline">
              <input id="username" name="username" type="text" spellcheck="false" autocomplete="off" />
              <button type="button" class="uline__btn" id="userClear" aria-label="Clear" tabindex="-1" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 12.1-1.4 1.4L12 13.4l-2.1 2.1-1.4-1.4L10.6 12 8.5 9.9l1.4-1.4L12 10.6l2.1-2.1 1.4 1.4L13.4 12l2.1 2.1Z"/></svg>
              </button>
            </div>
          </div>

          <!-- Password (underline style) -->
          <div class="field">
            <label class="field__label" id="lblPass" for="password"></label>
            <div class="uline">
              <input id="password" name="password" type="password" autocomplete="off" />
              <span class="uline__caps" id="capsHint" title="" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 11h4v4h8v-4h4L12 3ZM8 17h8v4H8v-4Z"/></svg>
              </span>
              <button type="button" class="uline__btn" id="pwToggle" aria-label="Show password" tabindex="-1">
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.1 1 12c1.7 2.9 5.5 7 11 7s9.3-4.1 11-7c-1.7-2.9-5.5-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M2 4.3 3.3 3 21 20.7 19.7 22l-3.1-3.1A11.7 11.7 0 0 1 12 19C6.5 19 2.7 14.9 1 12a17 17 0 0 1 4.2-4.9L2 4.3Zm7.6 7.6 2.5 2.5a2 2 0 0 1-2.5-2.5Zm2.4-3.9c2.2 0 4 1.8 4 4 0 .5-.1 1-.3 1.5l-5.2-5.2c.5-.2 1-.3 1.5-.3Zm0-3C17.5 5 21.3 9.1 23 12a17.2 17.2 0 0 1-2.8 3.6l-2.9-2.9a4 4 0 0 0-5-5L9.9 5.3c.7-.2 1.4-.3 2.1-.3Z"/></svg>
              </button>
            </div>
          </div>

          <!-- Verify code (optional; hidden by default via CONFIG.showVerifyCode) -->
          <div class="field" id="verifyField" hidden>
            <label class="field__label" id="lblCode" for="verifycode"></label>
            <div class="verify">
              <div class="uline uline--code">
                <input id="verifycode" name="verifycode" type="text" maxlength="6" spellcheck="false" autocomplete="off" />
              </div>
              <canvas id="captcha" class="verify__img" width="116" height="40" title="Refresh"></canvas>
              <button type="button" class="verify__refresh" id="captchaRefresh" aria-label="Refresh code">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6V3L8 7l4 4V8a4 4 0 1 1-4 4H6a6 6 0 1 0 6-6Z"/></svg>
              </button>
            </div>
          </div>

          <!-- Remember + forgot -->
          <div class="row">
            <label class="check">
              <input type="checkbox" id="remember" />
              <span class="check__box" aria-hidden="true"></span>
              <span id="lblRemember"></span>
            </label>
            <a href="#" class="link" id="lblForgot"></a>
          </div>

          <!-- Inline status -->
          <div class="status" id="status" role="status" aria-live="polite"></div>

          <!-- Submit -->
          <button type="submit" class="btn" id="loginBtn"><span id="lblLogin"></span></button>
        </form>
      </div>
    </section>

    <!-- ============ Footer ============ -->
    <footer class="footer">
      <p id="footerBrowser"></p>
      <p id="footerCopyright"></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
