# Почтовый стек Mail.True (локальная разработка)
# Запуск:  docker compose -f infra/docker-compose.yml up -d
# Перед первым запуском: скопировать .env.example -> .env и запустить scripts/gen-certs.sh
#
# ------------------------------------------------------------------
# ИМЕНА КОНТЕЙНЕРОВ ЗАДАЁТ ИМЯ ПРОЕКТА, А НЕ container_name
# ------------------------------------------------------------------
# Здесь намеренно НЕТ ни одного `container_name:`. Жёсткое имя — это
# глобальное имя на всём демоне Docker, а не имя внутри стека: два стенда
# на одной машине с ним не поднять вовсе. Второй `docker compose up`
# падал на первом же сервисе:
#
#   Error response from daemon: Conflict. The container name
#   "/mail-postgres" is already in use by container "…"
#
# То есть ни проверить обновление рядом с рабочим стендом, ни держать
# тестовый контур на той же машине было нельзя.
#
# Без container_name Docker Compose называет контейнеры сам:
# <имя проекта>-<сервис>-<номер>, например `mailtrue-postgres-1`.
# Имя проекта берётся отсюда (`name:` ниже), а переопределяется
# переменной COMPOSE_PROJECT_NAME или ключом `-p` — именно так уже
# работают install/backup.sh, install/restore.sh и install/uninstall.sh.
#
# Второй стенд рядом с первым (все три группы значений обязаны отличаться):
#   COMPOSE_PROJECT_NAME=mailtrue2 \
#   DOCKER_SUBNET=172.29.0.0/16 RESOLVER_IP=172.29.0.53 DOVECOT_IP=172.29.0.54 \
#   SMTP_PORT=2525 SUBMISSION_PORT=2587 ... \
#   docker compose -f infra/docker-compose.yml up -d
#
# ОБРАЩЕНИЕ К КОНТЕЙНЕРАМ. Внутри сети стека службы по-прежнему видят друг
# друга по ИМЕНИ СЕРВИСА (postgres, redis, dovecot, postfix, rspamd) —
# это имя даёт встроенный DNS Docker, и от имени контейнера оно не зависит.
# Снаружи обращаться нужно через compose (`docker compose exec postgres …`),
# а не `docker exec mail-postgres …`.
# ------------------------------------------------------------------
name: ${COMPOSE_PROJECT_NAME:-mailtrue}

services:
  # ------------------------------------------------------------------
  # Unbound — свой рекурсивный DNS-резольвер.
  # Бесплатные списки Spamhaus/URIBL не отвечают на запросы через публичные
  # резольверы (8.8.8.8 и т.п.): вместо ответа приходит 127.255.255.254
  # «blocked, open resolver», и проверки молча перестают работать.
  # Поэтому rspamd и postfix резолвят DNS через этот сервис.
  # Адрес фиксированный (${RESOLVER_IP}) — на него ссылаются dns: у сервисов.
  # ------------------------------------------------------------------
  unbound:
    build: ./unbound
    restart: unless-stopped
    environment:
      # Логирование каждого DNS-запроса (для отладки «уходит ли запрос к списку»).
      # По умолчанию выключено; infra/test-antispam.sh включает при необходимости.
      UNBOUND_LOG_QUERIES: ${UNBOUND_LOG_QUERIES:-no}
      UNBOUND_DNSSEC: ${UNBOUND_DNSSEC:-yes}
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      default:
        ipv4_address: ${RESOLVER_IP:-172.28.0.53}

  # ------------------------------------------------------------------
  # PostgreSQL 16 — виртуальные домены, ящики, алиасы
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Миграции выполняются при первичной инициализации БД (пустой volume)
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      # Проверяем настоящее подключение по сети с паролем, а не только
      # готовность процесса.
      #
      # `pg_isready` ходит локальным сокетом, где стоит доверительный вход,
      # и пароль не спрашивает вовсе. Из-за этого база объявлялась здоровой,
      # будучи недоступной всем службам сразу — ровно так выглядит
      # восстановление копии на новую установку: том уже создан со старым
      # паролем, окружение говорит новый, Postgres на непустом томе окружение
      # игнорирует. Все проверки при этом зелёные, а почта не работает.
      # Эту слепую зону нашли дважды независимыми проходами.
      # Адрес берём сетевой, а не петлю: для 127.0.0.1 в правилах доступа
      # стоит доверительный вход, и подключение оттуда проходит с любым
      # паролем. Проверено — первая попытка исправления с петлёй принимала
      # заведомо неверный пароль, то есть слепую зону не закрывала.
      # Сетевой адрес попадает под правило с проверкой пароля — тем же
      # путём, каким ходят все остальные службы стека.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=$${POSTGRES_PASSWORD} psql -h "$$(hostname -i)"
          -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'select 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # Redis 7 — сессии, кэш, очереди, статистика rspamd
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ------------------------------------------------------------------
  # Dovecot — IMAP (143/993), LMTP (24), SASL-auth для Postfix (12345)
  # ------------------------------------------------------------------
  dovecot:
    build: ./dovecot
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Служебный пользователь: вход администратора в чужой ящик (админка)
      DOVECOT_MASTER_USER: ${DOVECOT_MASTER_USER:-}
      DOVECOT_MASTER_PASSWORD: ${DOVECOT_MASTER_PASSWORD:-}
      # Принимать ли пароль без TLS. Значение по умолчанию — безопасное:
      # если переменную не задали, пароль открытым текстом не принимается.
      DOVECOT_DISABLE_PLAINTEXT_AUTH: ${DOVECOT_DISABLE_PLAINTEXT_AUTH:-yes}
      # DOCKER_SUBNET здесь БОЛЬШЕ НЕТ, и это не упущение.
      #
      # Переменная передавалась с обещанием «внутренняя сеть — доверенная:
      # снимает общий штраф за подбор пароля с релея Postfix», но в самом
      # шаблоне конфигурации её подстановки нет ни одной. Там же и
      # объяснено почему: послабление через login_trusted_networks
      # пробовали, измерение показало, что на задержку оно не влияет, и
      # его убрали — а переменная с обещанием осталась.
      #
      # Настройка, которая объявлена, проброшена и ничего не делает, хуже
      # отсутствующей: следующий человек будет ею чинить.
    volumes:
      - vmail:/var/mail/vhosts
      # Индексы Dovecot, включая полнотекстовый индекс Xapian.
      # Отдельный постоянный том: переживает пересоздание контейнера.
      - mailindex:/var/mail/index
      - ./dovecot/conf:/etc/dovecot-repo:ro
      - ./data/certs:/certs:ro
      # Журнал Dovecot: файл читает админка, в stdout его переливает tail
      # (см. dovecot/entrypoint.sh), поэтому docker compose logs работает
      - maillogs:/var/log/mail
    ports:
      - '127.0.0.1:${IMAP_PORT:-143}:143'
      - '127.0.0.1:${IMAPS_PORT:-993}:993'
      - '127.0.0.1:${POP3_PORT:-110}:110'
      - '127.0.0.1:${POP3S_PORT:-995}:995'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 143 IMAP, 24 LMTP, 12345 SASL-auth для Postfix, 12340 quota-status.
      #
      # Порт 12345 здесь обязателен. Без него контейнер объявлялся здоровым,
      # пока служба аутентификации ещё не слушала, — и Postfix, дождавшись
      # «здоровья», получал на первой же отправке с паролем ошибку
      # «Connection lost to authentication server». В боевой жизни это
      # означало бы неудачную отправку у пользователя при каждом запуске
      # или обновлении стека.
      test:
        [
          'CMD-SHELL',
          'nc -z 127.0.0.1 143 && nc -z 127.0.0.1 24 && nc -z 127.0.0.1 12345 && nc -z 127.0.0.1 12340',
        ]
      # Раз в полминуты, а не в пять секунд.
      #
      # Проверка стучится в LMTP и IMAP, и Dovecot добросовестно пишет о
      # каждом таком стуке: «lmtp Connect from 127.0.0.1» и «imap-login
      # Disconnected: no auth attempts». При интервале в пять секунд это
      # больше тридцати тысяч строк в сутки в разделе «Ящики и доступ» —
      # ровно там, где ищут чужие входы в ящик. Собственный служебный шум
      # вытеснял из журнала то, ради чего журнал заведён.
      #
      # Что теряем: скорость обнаружения. Упавший Dovecot будет замечен
      # за полминуты вместо пяти секунд. Это приемлемо — старт проверяется
      # отдельно (start_period + retries), а на живом сервере Dovecot
      # падает не сам по себе, а вместе с чем-то, что видно и так.
      interval: 30s
      timeout: 3s
      # Первые полторы минуты после старта — своим темпом: пока служба
      # поднимается, ждать по полминуты между попытками незачем.
      start_interval: 3s
      start_period: 90s
      retries: 5
    networks:
      default:
        # Постоянный адрес — не косметика, а лечение реального дефекта.
        # Postfix обращается к Dovecot за проверкой пароля (SASL) и за квотой,
        # а долгоживущий процесс smtpd запоминает разрешённый адрес. При
        # пересоздании контейнера Dovecot получал новый адрес, Postfix
        # продолжал стучаться по старому, и отправка с аутентификацией падала
        # с «Connection lost to authentication server» — до перезапуска самого
        # Postfix. То есть любое обновление Dovecot ломало отправку письма
        # у пользователя. С постоянным адресом переподключение проходит само.
        ipv4_address: ${DOVECOT_IP:-172.28.0.54}

  # ------------------------------------------------------------------
  # Rspamd — антиспам + DKIM-подпись, milter для Postfix (11332)
  # ------------------------------------------------------------------
  rspamd:
    build: ./rspamd
    restart: unless-stopped
    # Весь внешний DNS (списки, SPF, DKIM, DMARC) — только через свой резольвер.
    dns:
      - ${RESOLVER_IP:-172.28.0.53}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD}
      # Адрес своего резольвера для встроенного DNS-клиента rspamd
      RESOLVER_IP: ${RESOLVER_IP:-172.28.0.53}
      # Антивирус: по умолчанию выключен (ClamAV с базами ≈ 1 ГБ памяти).
      # Включается вместе с профилем: CLAMAV_ENABLED=true + --profile clamav
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
    volumes:
      - rspamd-data:/var/lib/rspamd
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      # Свои правила на lua. Подключает их entrypoint — он дописывает
      # строчки в rspamd.local.lua, который rspamd читает сам.
      - ./rspamd/lua:/etc/rspamd/lua:ro
      # Списки (белые/чёрные). Каталог репозитория подключается только на
      # ЧТЕНИЕ и служит заготовкой; рабочие карты живут в томе.
      #
      # Раньше rspamd правил файлы прямо в рабочем дереве git (правка из
      # раздела «Спам» идёт через /savemap, плюс entrypoint дописывает свой
      # домен в local_domains.map при каждом старте). Дерево на боевом
      # сервере от этого гарантированно грязнело, и документированное
      # обновление `git pull` обрывалось: «Your local changes would be
      # overwritten». Обычное «лечение» (`git checkout -- .`) стирало все
      # списки, которые администратор заносил руками, — после чего сервер
      # начинал пропускать занесённое в чёрный список и резать занесённое
      # в белый.
      - ./rspamd/maps.d:/etc/rspamd/maps.seed:ro
      - rspamd-maps:/etc/rspamd/maps.d
    ports:
      # Веб-интерфейс/API rspamd (пароль — RSPAMD_PASSWORD)
      - '127.0.0.1:${RSPAMD_WEB_PORT:-11334}:11334'
    depends_on:
      redis:
        condition: service_healthy
      unbound:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11332' "]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # Postfix — SMTP 25 (приём), submission 587 (STARTTLS + SASL),
  # submissions 465 (TLS сразу) — его анонсирует автонастройка клиентов
  # ------------------------------------------------------------------
  postfix:
    build: ./postfix
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME}
    # MX/A-записи и проверки при приёме — через свой резольвер.
    # Имена контейнеров (dovecot, rspamd, postgres) по-прежнему резолвит
    # встроенный DNS Docker, поэтому доставка не зависит от unbound.
    dns:
      - ${RESOLVER_IP:-172.28.0.53}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Постоянный адрес Dovecot попадает в mynetworks: без права слать
      # почту не работают правила «переслать копию» и «автоответчик».
      # Именно один адрес, а не подсеть — рассылать не должен каждый контейнер.
      DOVECOT_IP: ${DOVECOT_IP:-172.28.0.54}
      # Посредник к очереди для админки (см. infra/postfix/queue-agent.pl).
      # Показать очередь, посмотреть письмо, протолкнуть, удалить — больше
      # он не умеет ничего. Порт наружу НЕ публикуется: он доступен только
      # внутри сети стека. Без секрета посредник не запускается вовсе,
      # то есть по умолчанию раздел «Очередь» просто не работает.
      QUEUE_AGENT_TOKEN: ${QUEUE_AGENT_TOKEN:-}
      QUEUE_AGENT_PORT: ${QUEUE_AGENT_PORT:-11345}
      # Предел размера письма — ТОТ ЖЕ, что у веб-интерфейса.
      #
      # MESSAGE_MAX_BYTES правится в панели («Настройки сервера»), а здесь
      # раньше стояло число прямо в main.cf.template. Подняв предел в
      # панели, человек получал письмо, принятое нашим же интерфейсом и
      # отвергнутое нашим же Postfix с ответом 552 — то есть письмо,
      # которое «отправлено» и не дошло.
      MESSAGE_MAX_BYTES: ${MESSAGE_MAX_BYTES:-26214400}
    volumes:
      - ./postfix/conf:/etc/postfix-repo:ro
      - ./data/certs:/certs:ro
      # Журналы почтового стека: сюда пишет postlogd, отсюда их читает
      # админка. Сокета Docker у сервера приложения нет и не будет —
      # он означает права root на всей машине.
      - maillogs:/var/log/mail
      # Очередь Postfix — постоянный том, и это обязательно.
      #
      # Без него очередь жила внутри контейнера и исчезала при каждом
      # пересоздании. Проверено: два письма в очереди, `up -d --force-recreate
      # postfix` — и «Mail queue is empty». Отправителям при этом уже сказано
      # «принято», отбойник не придёт никогда, письма просто исчезают.
      # А штатное обновление (`install.sh` делает `up -d --build`) как раз
      # пересоздаёт контейнеры — то есть любое обновление молча теряло всю
      # отложенную почту. У Dovecot тома для писем и индексов сделаны сразу,
      # здесь пропустили.
      - postfix-spool:/var/spool/postfix
    ports:
      - '127.0.0.1:${SMTP_PORT:-25}:25'
      - '127.0.0.1:${SUBMISSION_PORT:-587}:587'
      - '127.0.0.1:${SUBMISSIONS_PORT:-465}:465'
    depends_on:
      postgres:
        condition: service_healthy
      dovecot:
        condition: service_healthy
      rspamd:
        condition: service_started
    healthcheck:
      # Живость мастера по pid-файлу, а НЕ `postfix status`.
      #
      # `postfix status` на каждый вызов пишет в журнал строку «the Postfix
      # mail system is running». При проверке раз в пять секунд это 17 тысяч
      # строк в сутки в том самом журнале, который админка показывает в
      # разделе «Журналы почты» и хранит с ограничением по объёму: полезные
      # записи о доставке вытеснялись бы отчётом проверки о самой себе.
      # ПОРТЫ, А НЕ PID. Раньше проверялось «жив ли процесс master» —
      # `kill -0` по его pid-файлу. Условие звучало разумно, а покраснеть
      # не могло НИКОГДА: entrypoint запускает Postfix как `postfix
      # start-fg`, и master получает PID 1. То есть проверка сводилась к
      # `kill -0 1` внутри контейнера, где единица — сам проверяемый
      # процесс: пока контейнер жив, она успешна всегда, а умер master —
      # контейнер завершился, и выполняться ей уже негде.
      #
      # Не ловилось при этом ровно то, ради чего проба и нужна: master жив,
      # а под ним сломано. Недоступны файлы подключения к базе
      # (`/etc/postfix/pgsql/*.cf`), не отвечает LMTP Dovecot, не читается
      # сертификат — панель и `docker compose ps` показывали зелёное.
      #
      # Стучимся в приём почты (25) и в отправку из почтовых программ
      # (587): оба порта поднимает и держит master, а `netcat` в образе
      # есть — тем же способом проверяется Dovecot выше.
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 25 && nc -z 127.0.0.1 587']
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # Autoconfig — автоопределение настроек почтовых клиентов:
  # Mozilla Autoconfig, Microsoft Autodiscover, .mobileconfig, DNS-записи
  # ------------------------------------------------------------------
  autoconfig:
    build:
      # Контекст — корень репозитория: сборке нужен tsconfig.base.json
      context: ..
      dockerfile: apps/autoconfig/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      # Каталог DKIM-ключей rspamd (примонтирован ниже read-only)
      DKIM_DNS_DIR: /rspamd/dkim

      # ------------------------------------------------------------
      # Имя провайдера и анонсируемые порты.
      #
      # Сервис их ЧИТАЛ из окружения (apps/autoconfig/src/config.ts), но
      # сюда не проброшено было ни одно — то есть настраиваемость
      # существовала только на бумаге: правка infra/.env не меняла ничего,
      # и в мастере настройки Thunderbird у любой установки, под каким бы
      # именем её ни продавали, стояло «Mail.True».
      #
      # Имена намеренно с приставкой AUTOCONFIG_: это АНОНСИРУЕМЫЕ порты,
      # а не порты публикации. Одноимённые IMAPS_PORT/SUBMISSION_PORT выше
      # в этом же файле означают совсем другое — порт хоста, на котором
      # сервис опубликован на машине разработчика. Взять их сюда значило бы
      # разослать почтовым клиентам порт с чужой машины: на боевом сервере
      # список портов задан заново (install/compose.prod.yml) и всегда
      # стандартный.
      # ------------------------------------------------------------
      PROVIDER_NAME: ${PROVIDER_NAME:-Mail.True}
      PROVIDER_SHORT_NAME: ${PROVIDER_SHORT_NAME:-Mail.True}
      IMAPS_PORT: ${AUTOCONFIG_IMAPS_PORT:-993}
      IMAP_STARTTLS_PORT: ${AUTOCONFIG_IMAP_STARTTLS_PORT:-143}
      POP3S_PORT: ${AUTOCONFIG_POP3S_PORT:-995}
      POP3_STARTTLS_PORT: ${AUTOCONFIG_POP3_STARTTLS_PORT:-110}
      SUBMISSION_PORT: ${AUTOCONFIG_SUBMISSION_PORT:-587}
      SUBMISSIONS_PORT: ${AUTOCONFIG_SUBMISSIONS_PORT:-465}
      # Адрес отчётов DMARC в рекомендуемых DNS-записях.
      # Пусто = postmaster@<домен> (подставляется в коде).
      DMARC_RUA: ${DMARC_RUA:-}
      DNS_TTL: ${DNS_TTL:-3600}
      LOG_LEVEL: ${AUTOCONFIG_LOG_LEVEL:-info}
    volumes:
      # Ключи DKIM генерирует rspamd; autoconfig читает готовую DNS-запись
      - rspamd-data:/rspamd:ro
    ports:
      # Прямой доступ для отладки; клиенты ходят через nginx
      - '127.0.0.1:${AUTOCONFIG_PORT:-8025}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz | grep -q ''"ok":true''']
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # API — сервер приложения: /api/* и WebSocket /ws.
  # Ходит в Dovecot по IMAP от имени пользователя, отправляет через
  # submission Postfix, сессии держит в Redis, настройки — в Postgres.
  # ------------------------------------------------------------------
  api:
    build:
      # Контекст — корень репозитория: это npm workspaces
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # Потолок кучи V8. Без него Node считает размер кучи от объёма памяти
      # машины и на сервере с 32 ГБ спокойно занимает 120 МБ там, где хватает
      # 45: сборка мусора просто не спешит. Цель — VPS на 2 ГБ, поэтому
      # потолок задан явно и не зависит от того, где стек запущен.
      # Предел кучи должен вмещать самый большой допустимый запрос.
      #
      # Было 192 МБ при разрешённом теле письма в 12 МБ — и это не просто
      # несогласованность: любой вошедший пользователь ОДНИМ запросом с телом
      # в 4 МБ клал весь сервер приложения. Проверено, воспроизводится втрое:
      # 3 МБ — ответ 200, 4 МБ — «Reached heap limit», процесс перезапускается,
      # у всех остальных обрываются сессии, соединения и отправка.
      #
      # Разбор такого запроса держит в памяти сразу несколько его копий:
      # само тело, разобранную строку, результат проверки схемы. Поэтому
      # запас берётся кратный, а не впритык.
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=512}

      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}

      # Страна входа. off — не определять (умолчание: базы нет),
      # log — писать в журнал, allow — пускать только из списка стран.
      # Касается ТОЛЬКО входа человека; входящую почту по стране никто не
      # фильтрует и фильтровать не будет.
      GEOIP_LOGIN_POLICY: ${GEOIP_LOGIN_POLICY:-off}
      GEOIP_ALLOWED_COUNTRIES: ${GEOIP_ALLOWED_COUNTRIES:-}
      GEOIP_DB_PATH: /srv/geoip/country.csv

      # Почтовые службы — по именам контейнеров внутри сети стека
      IMAP_HOST: dovecot
      IMAP_PORT: 143
      IMAP_SECURE: 'false'
      SMTP_HOST: postfix
      SMTP_PORT: 587
      SMTP_SECURE: 'false'
      # Сертификат самоподписанный, а соединение всё равно не выходит
      # за пределы docker-сети. На боевом сервере значение то же:
      # имя контейнера в сертификате Let's Encrypt не значится.
      TLS_REJECT_UNAUTHORIZED: ${TLS_REJECT_UNAUTHORIZED:-false}

      # Порты, которые панель ПОДСКАЗЫВАЕТ: SRV-записи в разделе «Домены»
      # и заготовка «свой ящик» при подключении внешних учётных записей.
      # Не порты подключения — те заданы выше (IMAP_PORT 143, SMTP_PORT 587
      # внутри сети стека).
      #
      # Берутся из AUTOCONFIG_*, то есть из того же источника, что и выдача
      # сервиса автонастройки: подсказка в панели и настройка, которую
      # получает почтовая программа, обязаны совпадать. Раньше сюда шли
      # IMAPS_PORT/SUBMISSION_PORT из .env — а это порты ПУБЛИКАЦИИ на
      # хосте, их двигают, чтобы развести два стенда, и панель начинала
      # советовать порт с чужой машины. Третий из тройки, POP3S_PORT,
      # код читал (apps/api/src/admin/config.ts), но сюда его не пробросили
      # вовсе — правка в .env не меняла подсказку SRV для POP3S ничем.
      IMAPS_PORT: ${AUTOCONFIG_IMAPS_PORT:-993}
      SUBMISSION_PORT: ${AUTOCONFIG_SUBMISSION_PORT:-587}
      POP3S_PORT: ${AUTOCONFIG_POP3S_PORT:-995}
      PROVIDER_NAME: ${PROVIDER_NAME:-Mail.True}

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Кому верить в X-Forwarded-For. Только петля и подсеть стека, где
      # стоит nginx: заголовок подставляет сам клиент, и доверие «всем»
      # означало бы обход ограничения частоты запросов сменой заголовка
      # и любой выдуманный адрес в журнале аудита. Сам nginx этот заголовок
      # перезаписывает (см. infra/nginx/templates/app.conf.template).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,${DOCKER_SUBNET:-172.28.0.0/16}}

      # Секреты только из .env — в открытом виде здесь ничего нет
      SESSION_STORE: redis
      SESSION_SECRET: ${SESSION_SECRET:?нужен SESSION_SECRET в infra/.env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      EXTERNAL_ACCOUNTS_KEY: ${EXTERNAL_ACCOUNTS_KEY:-}
      # На боевом сервере — true (см. install/compose.prod.yml):
      # cookie сессии не должна уходить по открытому HTTP.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Через nginx почта и API живут на одном имени хоста, поэтому CORS
      # нужен только режиму разработки (vite на 5173/5174).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

      # Служебный пользователь Dovecot: вход администратора в чужой ящик
      # и сборщик писем с внешних ящиков
      DOVECOT_MASTER_USER: ${DOVECOT_MASTER_USER:-}
      DOVECOT_MASTER_PASSWORD: ${DOVECOT_MASTER_PASSWORD:-}

      # Перенос почты с чужого сервера (раздел «Перенос почты» в панели).
      # Два ящика одновременно, а не «сколько потянет»: с той стороны чужой
      # сервер, обслуживающий живых людей. Срок в часах — про ПАРОЛИ:
      # они лежат зашифрованными ровно пока идёт задание, и брошенное
      # задание должно когда-то сдаться, а не хранить их бессрочно.
      MIGRATION_CONCURRENCY: ${MIGRATION_CONCURRENCY:-2}
      MIGRATION_MAX_HOURS: ${MIGRATION_MAX_HOURS:-48}

      # Личные правила фильтрации кладутся прямо в почтовое хранилище:
      # том vmail примонтирован, и процесс работает под uid 5000 (vmail),
      # тем же, что у Dovecot. Транспорт docker здесь не годится —
      # docker-сокет внутрь контейнера не пробрасывается и не должен.
      SIEVE_TRANSPORT: ${SIEVE_TRANSPORT:-local}
      SIEVE_ROOT: /var/mail/vhosts
      # Предел просмотра писем при «применить правило к уже полученным».
      FILTER_APPLY_MAX_MESSAGES: ${FILTER_APPLY_MAX_MESSAGES:-5000}

      # ------------------------------------------------------------
      # Разделы владельца ящика: история входов, выгрузка ящика
      # целиком и восстановление после очистки корзины.
      # ------------------------------------------------------------

      # Сколько дней хранить СВОИ записи о входах (веб). Входы по IMAP,
      # POP3 и отправка читаются из журналов Postfix и Dovecot и живут
      # столько, сколько живут журналы.
      MAILBOX_ACCESS_LOG_DAYS: ${MAILBOX_ACCESS_LOG_DAYS:-90}

      # Предел одноразовых адресов на ящик (считает и выключенные).
      DISPOSABLE_ALIAS_LIMIT: ${DISPOSABLE_ALIAS_LIMIT:-50}

      # Выгрузка ящика в ZIP. Выключатель нужен закрытому контуру:
      # готовый архив — это копия всей переписки в открытом виде на
      # диске сервера, и где-то такое запрещено уставом, а не вкусом.
      MAILBOX_EXPORT_ENABLED: ${MAILBOX_EXPORT_ENABLED:-true}
      # Каталог внутри контейнера, из .env не выносится: это точка
      # монтирования тома api-uploads, а не настройка. ОТДЕЛЬНЫЙ от
      # /srv/data/uploads: тот чистит уборщик по возрасту файлов, и
      # архив однажды исчез бы посреди скачивания.
      MAILBOX_EXPORT_DIR: /srv/data/exports

      # Копия настроек перед сменой домена. На постоянном томе, а не во
      # временной папке: она нужна именно тогда, когда что-то пошло не так,
      # то есть после перезапуска.
      DOMAIN_CHANGE_BACKUP_DIR: ${DOMAIN_CHANGE_BACKUP_DIR:-/srv/data/domain-change}
      MAILBOX_EXPORT_TTL_HOURS: ${MAILBOX_EXPORT_TTL_HOURS:-48}
      # Одна выгрузка на весь сервер одновременно: это последовательное
      # вычитывание всего ящика по IMAP плюс сжатие. Две рядом не
      # ускоряют ни одну, а почту остальных замедляют обе.
      MAILBOX_EXPORT_CONCURRENCY: ${MAILBOX_EXPORT_CONCURRENCY:-1}
      MAILBOX_EXPORT_TICK_MS: ${MAILBOX_EXPORT_TICK_MS:-5000}
      # Потолок размера архива. Не про жадность, а про диск: том общий,
      # и один ящик на терабайт заполнил бы его целиком, после чего
      # перестала бы работать загрузка вложений у всех.
      MAILBOX_EXPORT_MAX_BYTES: ${MAILBOX_EXPORT_MAX_BYTES:-21474836480}

      # Потолок срока хранения очищенной корзины, в днях. Сам срок
      # выбирает владелец ящика (это его место), сервер задаёт границу.
      TRASH_RECOVERY_MAX_DAYS: ${TRASH_RECOVERY_MAX_DAYS:-30}
      TRASH_RECOVERY_TICK_MS: ${TRASH_RECOVERY_TICK_MS:-60000}

      # Антиспам и свой резольвер — только для сводки состояния админки.
      # Ни то, ни другое не мешает почте ходить при отказе, поэтому в пробу
      # контейнера они не входят; зато остановленный rspamd означает и почту
      # без проверки, и исходящие БЕЗ подписи DKIM — увидеть это можно
      # только в сводке. Пароль контроллера нужен для проверки подписи.
      RSPAMD_HOST: rspamd
      RSPAMD_CONTROLLER_PORT: 11334
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD:-}
      RESOLVER_IP: ${RESOLVER_IP:-}

      # У кого спрашивать DNS при проверке домена в админке.
      # НЕ у unbound выше: тот резольвер наш, и проверка показала бы то,
      # что мы сами себе прописали, а вопрос стоит «видит ли наши записи
      # остальной интернет». Пусто — публичные резольверы по умолчанию
      # (см. PUBLIC_RESOLVERS в apps/api/src/admin/dns.ts).
      DNS_CHECK_RESOLVERS: ${DNS_CHECK_RESOLVERS:-}

      UPLOAD_DIR: /srv/data/uploads

      # Своё оформление входа (OEM): логотип и подписи страниц входа.
      # Обязательно в ТОМЕ, а не внутри образа: логотип должен переживать
      # перезапуск и обновление продукта, а каталог образа при обновлении
      # исчезает. Том api-branding входит и в install/backup.sh, и в копию
      # настроек из панели управления.
      BRANDING_DIR: /srv/branding

      # ------------------------------------------------------------
      # Раздел «Почтовый поток» админки: очередь и журналы.
      #
      # Очередь: посредник внутри контейнера postfix (queue-agent.pl).
      # Секрет общий с ним; пустой означает «раздел очереди недоступен»,
      # и админка честно об этом скажет вместо пустой таблицы.
      #
      # Журналы: общий том, куда пишут postfix, dovecot и сам сервер
      # приложения. Сокет Docker не нужен и не пробрасывается.
      # ------------------------------------------------------------
      MAIL_QUEUE_AGENT_URL: http://postfix:${QUEUE_AGENT_PORT:-11345}
      QUEUE_AGENT_TOKEN: ${QUEUE_AGENT_TOKEN:-}

      # ------------------------------------------------------------
      # Перезапуск служб из панели — через второго посредника.
      #
      # Сокета Docker у сервера приложения нет и здесь: перезапустить
      # rspamd после включения антивируса или пересоздать контейнер
      # автонастройки после смены анонсируемых портов он просит службу
      # service-agent, которая умеет только это и только над закрытым
      # списком служб (см. infra/service-agent/agent.pl).
      #
      # Сам себя сервер приложения перезапускает БЕЗ посредника: у всех
      # служб стоит restart: unless-stopped, поэтому достаточно корректно
      # завершиться — демон поднимет контейнер заново. Пустой секрет
      # означает «остальные службы из панели не перезапускаются», и
      # панель честно скажет это словами вместо мёртвой кнопки.
      # ------------------------------------------------------------
      SERVICE_AGENT_URL: http://service-agent:${SERVICE_AGENT_PORT:-11346}
      SERVICE_AGENT_TOKEN: ${SERVICE_AGENT_TOKEN:-}
      MAIL_LOG_DIR: /var/log/mail
      # Своя запись сервера приложения в тот же том (в stdout она идёт
      # по-прежнему). Пусто — не писать файл вовсе.
      API_LOG_FILE: ${API_LOG_FILE:-/var/log/mail/api.log}

      # Сколько хранить разобранную историю доставки. Оба ключа есть в
      # infra/.env.example и оба ЧИТАЮТСЯ кодом (apps/api/src/admin/config.ts),
      # но сюда их забыли пробросить — и правка в .env не делала ничего.
      # Настройка, которая молча не работает, хуже отсутствующей: человек
      # уменьшает срок хранения, видит его в файле и считает вопрос закрытым,
      # а таблица истории продолжает расти по прежним 14 дням.
      MAIL_FLOW_RETENTION_DAYS: ${MAIL_FLOW_RETENTION_DAYS:-14}
      MAIL_FLOW_MAX_ROWS: ${MAIL_FLOW_MAX_ROWS:-500000}
      # Как часто сборщик заглядывает в журнал Postfix. 0 — не собирать
      # вовсе (раздел «Почтовый поток» останется пустым).
      MAIL_FLOW_INTERVAL_SECONDS: ${MAIL_FLOW_INTERVAL_SECONDS:-5}

      # Снимки показателей сервера для графиков дашборда.
      MAIL_METRICS_INTERVAL_SECONDS: ${MAIL_METRICS_INTERVAL_SECONDS:-60}
      MAIL_METRICS_RETENTION_DAYS: ${MAIL_METRICS_RETENTION_DAYS:-7}
      MAIL_METRICS_MAX_ROWS: ${MAIL_METRICS_MAX_ROWS:-50000}

      # ------------------------------------------------------------
      # Дальше — переменные, которые код ЧИТАЛ, но которых не было ни
      # здесь, ни в infra/.env.example. То есть настройки существовали
      # только в схеме разбора окружения: поменять их можно было
      # исключительно пересборкой образа.
      #
      # Целые разделы продукта оказывались ненастраиваемыми на боевой
      # установке — уведомления при закрытой вкладке и логотипы
      # отправителей целиком, включая их выключатели.
      # ------------------------------------------------------------

      # --- Вход в админку и уборка ящиков ---
      ADMIN_SESSION_COOKIE_NAME: ${ADMIN_SESSION_COOKIE_NAME:-mt_admin}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      ADMIN_LOGIN_MAX_FAILURES: ${ADMIN_LOGIN_MAX_FAILURES:-5}
      ADMIN_LOCKOUT_MINUTES: ${ADMIN_LOCKOUT_MINUTES:-15}
      # Вторая половина защиты от подбора: промахи по УЧЁТКЕ со всех
      # адресов сразу (распределённый подбор) и срок, в течение которого
      # адрес считается своим — с него запирание учётки не действует.
      # Обе читаются кодом (admin/config.ts) с первого дня, но сюда их
      # не выносили: значит задать их в infra/.env было НЕЛЬЗЯ вовсе —
      # переменная просто не доходила до контейнера, а панель и описание
      # обещали настройку. Умолчания те же, что в коде.
      ADMIN_ACCOUNT_LOCK_FAILURES: ${ADMIN_ACCOUNT_LOCK_FAILURES:-30}
      ADMIN_KNOWN_IP_DAYS: ${ADMIN_KNOWN_IP_DAYS:-30}
      ADMIN_MAILBOX_TTL_SECONDS: ${ADMIN_MAILBOX_TTL_SECONDS:-3600}
      ADMIN_DEFAULT_QUOTA_BYTES: ${ADMIN_DEFAULT_QUOTA_BYTES:-1073741824}
      ADMIN_MAILBOX_PURGE_DELAY_MINUTES: ${ADMIN_MAILBOX_PURGE_DELAY_MINUTES:-0}
      ADMIN_JANITOR_INTERVAL_SECONDS: ${ADMIN_JANITOR_INTERVAL_SECONDS:-60}
      # Каталоги внутри контейнера, из .env не выносятся: это точки
      # монтирования томов выше, а не настройка.
      ADMIN_MAIL_ROOT: /var/mail/vhosts
      ADMIN_MAIL_INDEX_ROOT: /var/mail/index
      # Эти два задавались ТОЛЬКО умолчанием в схеме окружения, а пути
      # монтирования стояли ниже, в volumes. Совпадали они по договорённости
      # и разъехались бы при первой же правке одного из двух мест — молча:
      # раздел «Наблюдение» просто перестал бы видеть файлы миграций и
      # отметку о копии, показав «каталог не виден» на исправной установке.
      MIGRATIONS_DIR: /srv/migrations
      INSTALL_STATE_DIR: /srv/install-state
      # Каталог TLS-сертификата — тот же, что у nginx, Postfix и Dovecot.
      # Раздел «Сертификат» в панели читает отсюда текущий и кладёт сюда
      # принесённый; службы перечитывают файл сами (watch-certs.sh).
      TLS_CERT_DIR: /certs

      # --- Сессии почты, пределы запросов и частоты ---
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-mt_session}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      # Сколько места один ящик может занять НЕОТПРАВЛЕННЫМИ вложениями.
      # Том api-uploads общий: на нём же очередь отложенной отправки и
      # выгрузки ящиков, — то есть заливший его ломает отправку соседям,
      # а не себе. Уборщик тут не спасает: он ходит по возрасту, сутки
      # спустя. По умолчанию — десять писем предельного размера.
      UPLOAD_MAILBOX_MAX_BYTES: ${UPLOAD_MAILBOX_MAX_BYTES:-262144000}
      # Должен совпадать с message_size_limit в
      # infra/postfix/conf/main.cf.template — иначе письмо, принятое
      # веб-интерфейсом, отобьёт собственный же Postfix.
      MESSAGE_MAX_BYTES: ${MESSAGE_MAX_BYTES:-26214400}
      # Предел тела JSON при написании письма. Связан с потолком кучи
      # (NODE_OPTIONS выше): разбор запроса держит в памяти несколько
      # его копий.
      COMPOSE_BODY_MAX_BYTES: ${COMPOSE_BODY_MAX_BYTES:-12582912}
      IMAP_POOL_IDLE_MS: ${IMAP_POOL_IDLE_MS:-300000}
      # Двадцать секунд, а не две. Здесь стояли две — и умолчание из кода
      # (20 000, поставленное с подробным разбором) не действовало НИ НА
      # ОДНОЙ установке: compose подставляет своё значение раньше. Пробу
      # дёргают дашборд, «Наблюдение» и каждая открытая вкладка; при двух
      # секундах Dovecot и Postfix записывали каждый стук, и в журналах
      # почты стояла сплошная лента «Disconnected: no auth attempts»,
      # в которой тонула настоящая доставка.
      HEALTH_CACHE_MS: ${HEALTH_CACHE_MS:-20000}
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-3000}

      # --- Уведомления при закрытой вкладке (Web Push) ---
      # Ключи VAPID сервер генерирует сам при первом запуске и хранит
      # в базе. Задавать их здесь нужно ровно в одном случае — при
      # переносе установки на другой сервер: смена ключей обесценивает
      # все выданные браузерам подписки, и людям придётся разрешать
      # уведомления заново.
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      PUSH_TIMEOUT_MS: ${PUSH_TIMEOUT_MS:-10000}
      PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-86400}
      PUSH_PENDING_MAX: ${PUSH_PENDING_MAX:-50}
      PUSH_PENDING_TTL_MS: ${PUSH_PENDING_TTL_MS:-21600000}

      # --- Логотипы отправителей (BIMI и favicon) ---
      # Единственная часть продукта, которая по своей работе ходит в
      # интернет с сервера. Выключатель здесь — не удобство, а требование:
      # на закрытом контуре эти запросы недопустимы, и погасить их надо
      # уметь не пересобирая образ.
      SENDER_LOGOS_ENABLED: ${SENDER_LOGOS_ENABLED:-true}
      SENDER_LOGO_DNS_TIMEOUT_MS: ${SENDER_LOGO_DNS_TIMEOUT_MS:-2500}
      SENDER_LOGO_HTTP_TIMEOUT_MS: ${SENDER_LOGO_HTTP_TIMEOUT_MS:-4000}
      SENDER_LOGO_WAIT_MS: ${SENDER_LOGO_WAIT_MS:-3500}
      SENDER_LOGO_CONCURRENCY: ${SENDER_LOGO_CONCURRENCY:-4}
      SENDER_LOGO_LOOKUPS_PER_MINUTE: ${SENDER_LOGO_LOOKUPS_PER_MINUTE:-60}
      SENDER_LOGO_TTL_HOURS: ${SENDER_LOGO_TTL_HOURS:-720}
      SENDER_LOGO_MISS_TTL_HOURS: ${SENDER_LOGO_MISS_TTL_HOURS:-168}
      SENDER_LOGO_ERROR_TTL_HOURS: ${SENDER_LOGO_ERROR_TTL_HOURS:-6}

      # --- Помощник на основе ИИ ---
      # Какой сервис и с каким ключом — настройка в админке. Здесь только
      # общий выключатель на весь сервер и служебные значения.
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_SETTINGS_CACHE_MS: ${AI_SETTINGS_CACHE_MS:-15000}
      AI_REDIS_PREFIX: ${AI_REDIS_PREFIX:-mt:ai:}

      # --- Чужие ящики и сборщик почты с них ---
      EXTERNAL_ACCOUNTS_ENABLED: ${EXTERNAL_ACCOUNTS_ENABLED:-true}
      COLLECTOR_SCHEDULER: ${COLLECTOR_SCHEDULER:-true}
      COLLECTOR_TICK_MS: ${COLLECTOR_TICK_MS:-60000}
      COLLECTOR_CONCURRENCY: ${COLLECTOR_CONCURRENCY:-2}
      COLLECTOR_BATCH_SIZE: ${COLLECTOR_BATCH_SIZE:-50}
      # Предел на один сбор и срок, после которого «идёт сбор» считается
      # брошенным. Второе нужно из-за перезапуска: пометка о начале
      # остаётся в базе, и без срока давности ящик залипал бы навсегда.
      COLLECTOR_TIMEOUT_MS: ${COLLECTOR_TIMEOUT_MS:-600000}
      COLLECTOR_STALE_MINUTES: ${COLLECTOR_STALE_MINUTES:-30}
      # Автоопределение настроек чужого сервера по адресу ящика: ходить
      # ли при этом в сеть. На закрытом контуре — false.
      AUTODETECT_NETWORK: ${AUTODETECT_NETWORK:-true}
      AUTODETECT_TIMEOUT_MS: ${AUTODETECT_TIMEOUT_MS:-4000}
      # Разделитель служебного пользователя в логине «ящик*мастер».
      #
      # Значение ЗАШИТО намеренно и из .env не берётся. Оно обязано
      # совпадать с auth_master_user_separator в конфигурации Dovecot
      # (infra/dovecot/conf/dovecot.conf.template), а там сейчас записана
      # звёздочка без всякой подстановки. Сделай этот ключ настраиваемым
      # здесь — и правка в .env развела бы две стороны одного логина:
      # сервер приложения собирал бы «ящик#мастер», Dovecot ждал бы
      # «ящик*мастер», и вход администратора в чужой ящик перестал бы
      # работать без единого сообщения о причине.
      DOVECOT_MASTER_SEPARATOR: '*'

      # Публичный адрес сервера — по нему панель проверяет обратную запись
      # (PTR), без которой крупные почтовые службы отбивают письма ещё на
      # подключении. Установщик определяет адрес и пишет в infra/.env
      # (install/install.sh, шаг «Публичный адрес сервера»), но до контейнера
      # значение не доходило: проверка PTR навсегда оставалась «неизвестно»
      # ровно по той причине, которую установщик уже считал устранённой.
      MAIL_PUBLIC_IPV4: ${MAIL_PUBLIC_IPV4:-}
    volumes:
      - vmail:/var/mail/vhosts
      # Индексы поиска — нужны при удалении ящика: без них уборка оставляла
      # каталог индекса от удалённого пользователя, и такой мусор копился.
      - mailindex:/var/mail/index
      # Временные вложения: файл живёт от загрузки до отправки письма
      - api-uploads:/srv/data
      # Свой логотип страниц входа. Отдельный том, а не подкаталог
      # api-uploads: тот чистится уборщиком по возрасту файлов, и логотип
      # однажды просто исчез бы со страницы входа сам собой.
      - api-branding:/srv/branding
      # Журналы почтового стека — источник разделов «Очередь» и «Журналы».
      # Postfix и Dovecot пишут сюда свои, сервер приложения кладёт свой.
      # Права rw нужны именно ради своего файла; чужие только читаются.
      - maillogs:/var/log/mail
      # Каталог сертификатов — на запись, ради раздела «Сертификат» в панели.
      #
      # Приватный ключ сервер приложения ЧИТАЕТ только чтобы сообщить, какой
      # сертификат сейчас стоит; наружу он не отдаётся ни в ответе, ни в
      # журнале (см. apps/api/src/admin/routes/tls.ts). Запись нужна ради
      # замены сертификата без доступа к серверу — а перезапускать службы
      # не нужно вовсе: nginx, Postfix и Dovecot следят за файлом сами
      # (см. infra/nginx/watch-certs.sh и entrypoint.sh почтовых служб).
      - ./data/certs:/certs
      # ------------------------------------------------------------------
      # Только чтение: то, без чего раздел «Наблюдение» врал умолчанием
      # ------------------------------------------------------------------
      # Файлы миграций и отметка последней резервной копии до сих пор
      # значились в списке «чего этот раздел не проверяет»: каталогов в
      # контейнере не было. Секретов в них нет — это SQL продукта и одна
      # строка с датой, — а без них панель не могла ответить на два
      # вопроса, которые задают чаще прочих: «схема базы соответствует
      # версии продукта?» и «когда в последний раз снимали копию?».
      #
      # Смонтированы ТОЛЬКО НА ЧТЕНИЕ: сервер приложения не должен уметь
      # ни править миграции, ни подделывать отметку о копии.
      - ./postgres/migrations:/srv/migrations:ro
      - ../install/state:/srv/install-state:ro
      # База «адрес → страна» для проверки страны входа. Тоже на чтение и
      # тоже не секрет: это публичный список диапазонов. Каталога может не
      # быть вовсе — базу скачивают отдельным шагом (install/fetch-geoip.sh),
      # и без неё вход работает как раньше.
      - ./data/geoip:/srv/geoip:ro
    ports:
      # Прямой доступ для отладки; браузер ходит через nginx
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dovecot:
        condition: service_healthy
    healthcheck:
      # Проба настоящая: краснеет (503), когда недоступно то, без чего
      # продукт не работает (Postgres, Redis, IMAP), — см. apps/api/src/health.ts.
      # Раньше она отвечала {ok:true} безусловно, поэтому десять попыток
      # ничего не стоили. Теперь их три: полторы минуты «всё хорошо» при
      # мёртвом Redis — это полторы минуты, пока прокси шлёт трафик в
      # сервер, который на каждый запрос отвечает ошибкой.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/healthz | grep -q ''"ok":true''']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ------------------------------------------------------------------
  # Web — собранный веб-интерфейс почты (статика, отдаётся nginx внутри
  # образа). Наружу не публикуется: снаружи к нему ходит фронтовый nginx.
  # ------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz | grep -q ''"ok":true''']
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # Admin — собранная админка (статика). Тоже только внутри сети.
  # ------------------------------------------------------------------
  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz | grep -q ''"ok":true''']
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # Nginx — единственный вход HTTP/HTTPS:
  #   <домен>, mail.<домен>   — почта (web) + /api и /ws (api)
  #   admin.<домен>           — админка (admin) + /api/admin
  #   autoconfig.<домен>,
  #   autodiscover.<домен>    — автонастройка почтовых клиентов
  #   /.well-known/ на корневом домене — она же
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      # Перекидывать ли HTTP на HTTPS. На стенде разработки — нет: всё
      # ходит по http://localhost:8080. На боевом сервере — да, иначе
      # вход по http молча не работает (cookie сессии с флагом Secure).
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      # Кому отвечает панель управления. Пусто — всем (как и было).
      # Разбор списка — в nginx/admin-allow.envsh.
      ADMIN_ALLOW_NETWORKS: ${ADMIN_ALLOW_NETWORKS:-}
      # Готовые директивы allow/deny, которые подставляются в конфигурацию.
      # Их собирает admin-allow.envsh, и объявление ЗДЕСЬ — не дублирование,
      # а страховка: envsubst подставляет только те переменные, что есть в
      # окружении, а незнакомую оставляет текстом. Стоило скрипту не
      # отработать (файл не смонтирован, права, опечатка в имени), и в
      # конфигурацию попадала строка «${ADMIN_ACCESS_RULES}» — nginx падал
      # с «unknown directive» и уходил в петлю перезапусков, унося с собой
      # и почту, и панель. Поймано живьём именно так.
      ADMIN_ACCESS_RULES: ''
      # Нужна тому же скрипту: запросы с самой машины приходят от шлюза
      # этой сети, и без неё запрет отрезал бы администратора от панели
      # на его же сервере.
      DOCKER_SUBNET: ${DOCKER_SUBNET:-172.28.0.0/16}
      # Пределы размера — те же, что у приложения. Из них считается
      # client_max_body_size (см. nginx/upload-limit.envsh): раньше в
      # шаблоне стояло число, и поднятый в панели предел упирался в nginx,
      # который отвечал 413 своей HTML-страницей вместо {error,message}.
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      MESSAGE_MAX_BYTES: ${MESSAGE_MAX_BYTES:-26214400}
      # Объявление-страховка: envsubst оставляет незнакомую переменную
      # текстом, и «${CLIENT_MAX_BODY_SIZE}» в конфигурации уронил бы
      # nginx с «unknown directive» — ровно так же, как ADMIN_ACCESS_RULES.
      CLIENT_MAX_BODY_SIZE: '31457280'
    volumes:
      # Шаблоны обрабатываются entrypoint-ом образа (envsubst -> conf.d)
      - ./nginx/templates:/etc/nginx/templates:ro
      # Считает client_max_body_size из пределов приложения.
      # Номер 16 — раньше 20-envsubst-on-templates.sh, который подставит.
      - ./nginx/upload-limit.envsh:/docker-entrypoint.d/16-mailtrue-upload-limit.envsh:ro
      - ./data/certs:/certs:ro
      # Слежение за файлом сертификата: раздел «Сертификат» в панели меняет
      # файл, а перезапускать контейнеры серверу приложения нечем (сокета
      # Docker у него нет). Штатный образ выполняет всё из этого каталога
      # перед запуском nginx — скрипт уходит в фон.
      - ./nginx/watch-certs.sh:/docker-entrypoint.d/40-mailtrue-watch-certs.sh:ro
      # Список сетей, которым отвечает панель (ADMIN_ALLOW_NETWORKS).
      # Расширение .envsh обязательно: такие файлы штатный образ выполняет
      # В ТЕКУЩЕЙ оболочке, и переменная доживает до подстановки шаблонов.
      # Номер 15 — раньше 20-envsubst-on-templates.sh, который её подставит.
      - ./nginx/admin-allow.envsh:/docker-entrypoint.d/15-mailtrue-admin-allow.envsh:ro
      # Ответы на проверку владения доменом. Только на чтение: nginx их
      # раздаёт, а кладёт certbot — писать сюда веб-серверу, смотрящему
      # наружу, незачем.
      - acme-challenge:/var/www/acme:ro
    ports:
      - '127.0.0.1:${NGINX_HTTP_PORT:-8080}:80'
      - '127.0.0.1:${NGINX_HTTPS_PORT:-8443}:443'
      # Резервный вход в панель по адресу сервера, без DNS. Слушает
      # только там, куда его привязали (ADMIN_LOCAL_BIND) — разбор в
      # шапке server-блока :8081 в nginx/templates/app.conf.template.
      - '${ADMIN_LOCAL_BIND:-127.0.0.1}:${ADMIN_LOCAL_PORT:-8081}:8081'
    depends_on:
      autoconfig:
        condition: service_healthy
      # Без готовых приложений nginx поднимать незачем: он их и раздаёт
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      # Через виртуальный хост autoconfig проксируется /healthz сервиса
      test:
        [
          'CMD-SHELL',
          'wget -qO /dev/null --header "Host: autoconfig.$${MAIL_DOMAIN}" http://127.0.0.1:80/healthz',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # Service-agent — посредник перезапуска служб для панели.
  #
  # ------------------------------------------------------------------
  # ПОЧЕМУ У НЕГО СОКЕТ DOCKER
  # ------------------------------------------------------------------
  # 59 настроек из 133 в разделе «Настройки сервера» начинают действовать
  # только после перезапуска, и до сих пор человеку в панели говорили
  # «идите в консоль». Перезапустить службу нельзя, не имея доступа к
  # Docker, — а сокет Docker означает права root на всей машине.
  #
  # Сервер приложения этого сокета не получает и не получит: он принимает
  # запросы из интернета и разбирает чужие письма. Вместо этого сокет
  # выдан отдельной службе, которая умеет ровно две вещи и только над
  # закрытым списком служб: перезапустить процесс и пересоздать контейнер.
  # Произвольных команд она не принимает вовсе, имя контейнера снаружи не
  # берёт, образы не собирает (--no-build). Подробный разбор — в шапке
  # infra/service-agent/agent.pl.
  #
  # ------------------------------------------------------------------
  # ЧТО ЕМУ ВИДНО
  # ------------------------------------------------------------------
  # Два файла на чтение и один на запись — и ничего больше. Каталог
  # проекта целиком НЕ монтируется (в отличие от установщика): читать
  # ключи DKIM, письма и сертификаты посреднику незачем.
  #
  #   docker-compose.yml   — из чего пересоздавать службу;
  #   compose.prod.yml     — боевое переопределение портов. Без него
  #                          пересозданный на боевом сервере dovecot
  #                          вернулся бы на 127.0.0.1, и почта у всех
  #                          клиентов в интернете умерла бы молча;
  #   .env                 — единственный файл на запись. Пересоздание
  #                          имеет смысл только с новым окружением, а
  #                          окружение compose берёт отсюда. Ключи,
  #                          которые разрешено писать, перечислены в
  #                          agent.pl поимённо и по службам.
  #
  # ------------------------------------------------------------------
  # БЕЗ СЕКРЕТА НЕ РАБОТАЕТ ВОВСЕ
  # ------------------------------------------------------------------
  # Пустой SERVICE_AGENT_TOKEN — и посредник не открывает порт. Панель
  # тогда честно говорит, что перезапуск из веба недоступен, и печатает
  # команду для консоли. Порт наружу не публикуется никогда: он доступен
  # только внутри сети стека.
  # ------------------------------------------------------------------
  service-agent:
    build: ./service-agent
    restart: unless-stopped
    environment:
      # Имя проекта нужно, чтобы найти свои контейнеры по меткам compose
      # и запускать compose в том же проекте, а не в новом.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mailtrue}
      SERVICE_AGENT_TOKEN: ${SERVICE_AGENT_TOKEN:-}
      SERVICE_AGENT_PORT: ${SERVICE_AGENT_PORT:-11346}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Пути внутри контейнера — часть устройства, а не настройка.
      - ./docker-compose.yml:/repo/infra/docker-compose.yml:ro
      - ../install/compose.prod.yml:/repo/install/compose.prod.yml:ro
      - ./.env:/env/.env
      # Пример настроек — эталон для сверки, а не данные.
      #
      # По нему посредник считает, сколько значений в рабочем infra/.env
      # так и остались из примера. Пароли-заглушки, доехавшие до боевого
      # сервера, — самая частая и самая тихая из дыр: всё работает, а
      # пароль базы известен любому, кто видел исходники. Файл лежит в
      # репозитории и секретов не содержит по определению, поэтому его
      # появление здесь не расширяет того, что посредник знает.
      - ./.env.example:/repo/infra/.env.example:ro
      # Якорь пути, а не данные.
      #
      # По нему посредник спрашивает у демона, каким каталог проекта
      # виден с ЕГО стороны сокета: compose обязан отдавать демону пути
      # хоста, иначе новый контейнер получит пустые тома вместо настроек
      # (проверено — rspamd поднимался без единого правила). Спрашивать
      # приходится именно про КАТАЛОГ: про монтирование файла Docker
      # Desktop отвечает путём клиента, а не демона.
      #
      # Взят собственный каталог сборки посредника: в нём нет ничего,
      # кроме Dockerfile и agent.pl, — то есть якорь не даёт доступа
      # ни к чему сверх уже имеющегося.
      - ./service-agent:/repo/infra/service-agent:ro

  # ------------------------------------------------------------------
  # fail2ban — бан по адресу за подбор паролей. ВКЛЮЧЁН ПО УМОЛЧАНИЮ.
  #
  # Читает журналы почтового стека из тома maillogs и, увидев череду
  # неудачных входов с одного адреса, закрывает этому адресу доступ к
  # серверу правилом пакетного фильтра. Пороги, сроки и белый список —
  # в infra/.env (ключи FAIL2BAN_*), устройство камер и фильтров —
  # в infra/fail2ban/ с подробными пояснениями.
  #
  # Выключается одним ключом: FAIL2BAN_ENABLED=false в infra/.env.
  # Служба при этом продолжает работать и остаётся здоровой — чтобы
  # «выключено» нельзя было спутать со «сломалось».
  #
  # ------------------------------------------------------------------
  # ПОЧЕМУ ЗДЕСЬ network_mode: host И NET_ADMIN — И ПОЧЕМУ ЭТО НЕ ДЫРА
  # ------------------------------------------------------------------
  # Задача службы — менять правила фильтрации ПАКЕТОВ НА ХОСТЕ. Изнутри
  # своей сетевой песочницы контейнер меняет правила этой самой песочницы
  # и не влияет ни на что: адрес продолжает доходить до почтовых портов.
  # Поэтому нужны две вещи и ровно они:
  #
  #   network_mode: host — работать в сетевом пространстве машины;
  #   cap_add NET_ADMIN, NET_RAW — право менять пакетный фильтр
  #     (без NET_RAW iptables не может работать с сырыми сокетами и
  #      отказывается выполнять часть операций).
  #
  # Почему это допустимо ИМЕННО ЗДЕСЬ. Служба не принимает данных ни от
  # кого: у неё нет ни одного слушающего порта, нет сокета Docker, нет
  # доступа к базе, к письмам и к настройкам. Всё, что в неё попадает, —
  # строки журналов, смонтированных ТОЛЬКО НА ЧТЕНИЕ, и она разбирает их
  # готовыми регулярными выражениями. Её единственное полномочие —
  # добавить и снять запись «этот адрес не пускать».
  #
  # Почему то же самое нельзя дать серверу приложения. Он делает ровно
  # обратное: принимает непроверенные данные снаружи — HTTP-запросы,
  # письма, вложения, — исполняет большую среду выполнения с десятками
  # сторонних зависимостей и ходит в сеть по адресам, которые ему назвал
  # пользователь. NET_ADMIN вместе с сетью хоста означал бы, что ЛЮБАЯ
  # дыра в любой из этих зависимостей превращается в право переписать
  # весь пакетный фильтр машины, а NET_RAW — в право слушать чужой
  # трафик и подменять его. Иначе говоря: у сторожа полномочий больше,
  # чем у сервера приложения, именно потому, что сторож ни с кем не
  # разговаривает.
  #
  # На машине разработчика под Docker Desktop network_mode: host не даёт
  # доступа к правилам хоста — служба поднимется, но банить будет некуда,
  # и это нормально: подбирают пароли на боевом сервере, а не на ноутбуке.
  # ------------------------------------------------------------------
  fail2ban:
    build: ./fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Включена ли защита вообще. false — служба живёт, камеры молчат.
      FAIL2BAN_ENABLED: ${FAIL2BAN_ENABLED:-true}
      # Подсеть стека попадает в белый список: вход в веб-почту сервер
      # приложения проверяет настоящим входом по IMAP, и все неудачные
      # входы через браузер видны в журнале Dovecot с адресом контейнера
      # api. Без белого списка первый же подбор пароля через веб-почту
      # забанил бы наш собственный контейнер.
      DOCKER_SUBNET: ${DOCKER_SUBNET:-172.28.0.0/16}
      FAIL2BAN_IGNORE_IPS: ${FAIL2BAN_IGNORE_IPS:-}
      FAIL2BAN_BANTIME: ${FAIL2BAN_BANTIME:-1h}
      FAIL2BAN_FINDTIME: ${FAIL2BAN_FINDTIME:-10m}
      FAIL2BAN_BANTIME_INCREMENT: ${FAIL2BAN_BANTIME_INCREMENT:-true}
      FAIL2BAN_BANTIME_MAX: ${FAIL2BAN_BANTIME_MAX:-7d}
      FAIL2BAN_DOVECOT_MAXRETRY: ${FAIL2BAN_DOVECOT_MAXRETRY:-15}
      FAIL2BAN_POSTFIX_MAXRETRY: ${FAIL2BAN_POSTFIX_MAXRETRY:-10}
      FAIL2BAN_API_MAXRETRY: ${FAIL2BAN_API_MAXRETRY:-20}
      FAIL2BAN_RECIDIVE_ENABLED: ${FAIL2BAN_RECIDIVE_ENABLED:-true}
      FAIL2BAN_RECIDIVE_BANTIME: ${FAIL2BAN_RECIDIVE_BANTIME:-1w}
      FAIL2BAN_RECIDIVE_MAXRETRY: ${FAIL2BAN_RECIDIVE_MAXRETRY:-3}
      FAIL2BAN_LOGLEVEL: ${FAIL2BAN_LOGLEVEL:-INFO}
    volumes:
      # Журналы почтового стека — ТОЛЬКО НА ЧТЕНИЕ. Служба их разбирает
      # и не имеет никакой причины в них писать; право записи в общий
      # журнал означало бы возможность подчистить следы.
      - maillogs:/var/log/mail:ro
      # Своё состояние: база действующих банов и собственный журнал.
      # Без постоянного места любое обновление продукта снимало бы все
      # баны разом, а нарастающий срок начинал бы счёт заново.
      # Каталог тот же, где стек держит остальные данные (infra/data).
      - ./data/fail2ban:/data
    depends_on:
      # Только порядок запуска: службе нужны файлы журналов. Ждать их
      # «здоровья» незачем — отсутствующий журнал не мешает ей стартовать,
      # она подхватит файл, когда он появится.
      - dovecot
      - postfix
      - api

  # ------------------------------------------------------------------
  # ClamAV — проверка вложений на вирусы. ВЫКЛЮЧЕН ПО УМОЛЧАНИЮ.
  #
  # Почему: clamd держит сигнатурные базы в памяти — это ~1.2 ГБ RSS плюс
  # ~350 МБ на диске. На VPS с 2 ГБ это больше половины всей памяти, тогда как
  # весь остальной продукт, вместе с веб-интерфейсом, укладывается в ~380 МБ.
  # Поэтому включается осознанно:
  #
  #   1) в infra/.env поставить CLAMAV_ENABLED=true
  #   2) docker compose -f infra/docker-compose.yml --profile clamav up -d
  #
  # Первый запуск скачивает базы (freshclam, ~5–10 минут) — до этого
  # healthcheck красный, а rspamd пишет в лог, что антивирус недоступен;
  # почта при этом продолжает ходить (fail-open, см. local.d/antivirus.conf).
  # ------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4_base
    profiles: ['clamav']
    restart: unless-stopped
    environment:
      # Отдельный контейнер freshclam не нужен — образ обновляет базы сам
      CLAMAV_NO_FRESHCLAMD: 'false'
      CLAMAV_NO_MILTERD: 'true'
      FRESHCLAM_CHECKS: '2'
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # ------------------------------------------------------------------
  # Installer — мастер первого запуска в браузере. ВЫКЛЮЧЕН ПО УМОЛЧАНИЮ.
  #
  # Поднимается только под своим профилем и только на время установки:
  #
  #   docker compose -f infra/docker-compose.yml --profile installer up -d installer
  #   docker compose -f infra/docker-compose.yml logs installer   # ключ доступа
  #
  # В обычном запуске стека этой службы нет вовсе — как у clamav выше.
  #
  # ------------------------------------------------------------------
  # ПОЧЕМУ У НЕЁ СОКЕТ DOCKER И ПОЧЕМУ ЭТО НЕ НАВСЕГДА
  # ------------------------------------------------------------------
  # Установка — это и есть «пересоздать контейнеры»: собрать образы,
  # поднять базу, применить схему, поднять остальное. Сделать это из
  # браузера, не имея доступа к Docker, нельзя в принципе.
  #
  # Сокет Docker равен правам root на всей машине, поэтому цена платится
  # ровно один раз и на ограниченное время:
  #
  #   * службы нет в обычном стеке (профиль installer);
  #   * restart: 'no' — демон её не поднимет ни после падения, ни после
  #     перезагрузки машины; вернуть её может только человек командой выше;
  #   * закончив, установщик ставит отметку «установлено» (infra/.env и
  #     таблица install_state) и останавливает сам себя;
  #   * поднятый повторно с этой отметкой, он отказывается работать и
  #     печатает, как снять отметку осознанно.
  #
  # ------------------------------------------------------------------
  # ПОЧЕМУ КАТАЛОГ ПРОЕКТА МОНТИРУЕТСЯ ЦЕЛИКОМ И НА ЗАПИСЬ
  # ------------------------------------------------------------------
  # Установщик не переписывает установку заново — он ЗАПУСКАЕТ ту же
  # install/install.sh, что и в консоли (см. apps/installer/src/install.ts).
  # Ей нужны: install/lib/common.sh, каталог миграций, infra/.env на
  # запись, infra/data/certs для сертификата и контекст сборки образов.
  # Это и есть каталог проекта.
  #
  # /etc/letsencrypt — тот же каталог, в котором держит сертификаты
  # certbot на хосте: иначе выпущенный из браузера сертификат пропал бы
  # вместе с контейнером, и продлевать на хосте было бы нечего.
  # ------------------------------------------------------------------
  installer:
    build:
      context: ..
      dockerfile: apps/installer/Dockerfile
    profiles: ['installer']
    # НЕ unless-stopped: остановив себя после установки, служба обязана
    # остаться остановленной — в том числе после перезагрузки машины.
    restart: 'no'
    # В сеть стека установщик не входит: со службами он разговаривает через
    # сокет Docker (docker compose exec), а не по сети.
    #
    # И это не мелочь. Сеть стека создаётся с подсетью из настроек — а
    # подсеть человек выбирает НА ШАГЕ «Порты», то есть уже после того, как
    # установщик поднялся. Войди он в сеть проекта, она создалась бы со
    # значением по умолчанию до всякого выбора: на машине, где 172.28.0.0/16
    # уже занята (второй стенд, VPN), первый же запуск установщика падал бы
    # с «Pool overlaps with other one on this address space» — то есть
    # ровно там, где человек и собирался эту подсеть поменять.
    network_mode: bridge
    environment:
      # Имя проекта нужно установщику дважды: найти себя среди контейнеров
      # (чтобы узнать, каким путём каталог проекта виден ДЕМОНУ) и запускать
      # docker compose в том же проекте, а не в новом.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mailtrue}
      # Порт, который установщик называет человеку в приглашении. Сам он
      # всегда слушает 8099 внутри контейнера — наружу его выводит ports ниже.
      INSTALLER_PORT: ${INSTALLER_PORT:-8099}
      # Отметка «установлено» на момент запуска контейнера. Установщик
      # перечитывает infra/.env и базу сам, но этот снимок позволяет ему
      # отказаться сразу, ещё до того, как он что-либо откроет.
      INSTALL_COMPLETED_AT: ${INSTALL_COMPLETED_AT:-}
      LOG_LEVEL: ${INSTALLER_LOG_LEVEL:-info}
      # Точка монтирования каталога проекта внутри контейнера. Это устройство
      # стека, а не настройка: путь обязан совпадать с volumes ниже, потому
      # что по нему установщик спрашивает у Docker, каким этот же каталог
      # виден на ХОСТЕ (см. apps/installer/src/repo.ts).
      MT_REPO_MOUNT: /repo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/repo
      - /etc/letsencrypt:/etc/letsencrypt
    ports:
      - '${INSTALLER_BIND:-0.0.0.0}:${INSTALLER_PORT:-8099}:8099'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8099/healthz | grep -q ''"ok":true''']
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  # Явная подсеть нужна, чтобы у резольвера был фиксированный адрес
  # (${RESOLVER_IP}) — его подставляем в dns: сервисов и в конфиг rspamd.
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}

volumes:
  pgdata:
  redisdata:
  vmail:
  # Индексы Dovecot + полнотекстовый индекс Xapian
  mailindex:
  rspamd-data:
  # Белые и чёрные списки антиспама: их правит и администратор из панели,
  # и entrypoint (свой домен). В томе, а не в рабочем дереве git, — иначе
  # обновление продукта спотыкается о собственные правки продукта.
  rspamd-maps:
  # Очередь Postfix: принятые, но ещё не доставленные письма.
  # Без постоянного тома пересоздание контейнера — а его делает любое
  # обновление — молча уничтожало всю отложенную почту.
  postfix-spool:
  # Временные вложения веб-интерфейса (от загрузки до отправки письма)
  api-uploads:
  # Своё оформление входа: логотип OEM и подписи страниц входа.
  # Без постоянного тома логотип пропадал бы при каждом обновлении
  # продукта — а обновление делают чаще, чем меняют логотип.
  api-branding:
  # Ответы на проверку владения доменом от Let's Encrypt.
  #
  # Общий том нужен потому, что кладёт файл одна сторона, а отдаёт другая:
  # пишет его certbot, запущенный посредником одноразовым контейнером, а
  # раздаёт nginx по адресу /.well-known/acme-challenge/. Каталог внутри
  # контейнера certbot тут не годится — он исчезнет вместе с контейнером
  # раньше, чем проверяющий успеет постучаться.
  #
  # Почему не проще: у certbot есть режим --standalone, который поднимает
  # свой сервер на 80-м порту. Для этого пришлось бы погасить nginx —
  # то есть оборвать соединение того самого администратора, который нажал
  # кнопку «выпустить сертификат». Поймано живьём: запрос отвечал «код
  # 000», и по нему нельзя было понять, выпустился сертификат или нет.
  acme-challenge:
  # Журналы почтового стека одним местом: postfix.log, dovecot.log, api.log.
  #
  # Зачем том, если есть `docker compose logs`. Затем, что сервер приложения
  # к нему не имеет доступа: для этого понадобился бы сокет Docker, а он даёт
  # права root на всей машине — платить такую цену за показ журналов нельзя.
  # Файлы в общем томе — единственный способ показать журналы в админке,
  # ничего не открывая наружу. В stdout контейнеров они по-прежнему идут
  # (tail в entrypoint), так что `docker compose logs` работает как раньше.
  maillogs:
  # Базы сигнатур ClamAV (только при профиле clamav)
  clamav-db:
