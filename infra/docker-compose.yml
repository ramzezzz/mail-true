# Почтовый стек Mail.True (локальная разработка)
# Запуск:  docker compose -f infra/docker-compose.yml up -d
# Перед первым запуском: скопировать .env.example -> .env и запустить scripts/gen-certs.sh
name: mailtrue

services:
  # ------------------------------------------------------------------
  # Unbound — свой рекурсивный DNS-резольвер.
  # Бесплатные списки Spamhaus/URIBL не отвечают на запросы через публичные
  # резольверы (8.8.8.8 и т.п.): вместо ответа приходит 127.255.255.254
  # «blocked, open resolver», и проверки молча перестают работать.
  # Поэтому rspamd и postfix резолвят DNS через этот сервис.
  # Адрес фиксированный (${RESOLVER_IP}) — на него ссылаются dns: у сервисов.
  # ------------------------------------------------------------------
  unbound:
    build: ./unbound
    container_name: mail-unbound
    restart: unless-stopped
    environment:
      # Логирование каждого DNS-запроса (для отладки «уходит ли запрос к списку»).
      # По умолчанию выключено; infra/test-antispam.sh включает при необходимости.
      UNBOUND_LOG_QUERIES: ${UNBOUND_LOG_QUERIES:-no}
      UNBOUND_DNSSEC: ${UNBOUND_DNSSEC:-yes}
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      default:
        ipv4_address: ${RESOLVER_IP:-172.28.0.53}

  # ------------------------------------------------------------------
  # PostgreSQL 16 — виртуальные домены, ящики, алиасы
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Миграции выполняются при первичной инициализации БД (пустой volume)
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Проверяем настоящее подключение по сети с паролем, а не только
      # готовность процесса.
      #
      # `pg_isready` ходит локальным сокетом, где стоит доверительный вход,
      # и пароль не спрашивает вовсе. Из-за этого база объявлялась здоровой,
      # будучи недоступной всем службам сразу — ровно так выглядит
      # восстановление копии на новую установку: том уже создан со старым
      # паролем, окружение говорит новый, Postgres на непустом томе окружение
      # игнорирует. Все проверки при этом зелёные, а почта не работает.
      # Эту слепую зону нашли дважды независимыми проходами.
      # Адрес берём сетевой, а не петлю: для 127.0.0.1 в правилах доступа
      # стоит доверительный вход, и подключение оттуда проходит с любым
      # паролем. Проверено — первая попытка исправления с петлёй принимала
      # заведомо неверный пароль, то есть слепую зону не закрывала.
      # Сетевой адрес попадает под правило с проверкой пароля — тем же
      # путём, каким ходят все остальные службы стека.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=$${POSTGRES_PASSWORD} psql -h "$$(hostname -i)"
          -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'select 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # Redis 7 — сессии, кэш, очереди, статистика rspamd
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mail-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ------------------------------------------------------------------
  # Dovecot — IMAP (143/993), LMTP (24), SASL-auth для Postfix (12345)
  # ------------------------------------------------------------------
  dovecot:
    build: ./dovecot
    container_name: mail-dovecot
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Служебный пользователь: вход администратора в чужой ящик (админка)
      DOVECOT_MASTER_USER: ${DOVECOT_MASTER_USER:-}
      DOVECOT_MASTER_PASSWORD: ${DOVECOT_MASTER_PASSWORD:-}
      # Принимать ли пароль без TLS. Значение по умолчанию — безопасное:
      # если переменную не задали, пароль открытым текстом не принимается.
      DOVECOT_DISABLE_PLAINTEXT_AUTH: ${DOVECOT_DISABLE_PLAINTEXT_AUTH:-yes}
      # Внутренняя сеть — доверенная: снимает общий штраф за подбор пароля
      # с релея Postfix, через который идут проверки паролей всех отправителей.
      DOCKER_SUBNET: ${DOCKER_SUBNET:-172.28.0.0/16}
    volumes:
      - vmail:/var/mail/vhosts
      # Индексы Dovecot, включая полнотекстовый индекс Xapian.
      # Отдельный постоянный том: переживает пересоздание контейнера.
      - mailindex:/var/mail/index
      - ./dovecot/conf:/etc/dovecot-repo:ro
      - ./data/certs:/certs:ro
      # Журнал Dovecot: файл читает админка, в stdout его переливает tail
      # (см. dovecot/entrypoint.sh), поэтому docker compose logs работает
      - maillogs:/var/log/mail
    ports:
      - "127.0.0.1:${IMAP_PORT:-143}:143"
      - "127.0.0.1:${IMAPS_PORT:-993}:993"
      - "127.0.0.1:${POP3_PORT:-110}:110"
      - "127.0.0.1:${POP3S_PORT:-995}:995"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 143 IMAP, 24 LMTP, 12345 SASL-auth для Postfix, 12340 quota-status.
      #
      # Порт 12345 здесь обязателен. Без него контейнер объявлялся здоровым,
      # пока служба аутентификации ещё не слушала, — и Postfix, дождавшись
      # «здоровья», получал на первой же отправке с паролем ошибку
      # «Connection lost to authentication server». В боевой жизни это
      # означало бы неудачную отправку у пользователя при каждом запуске
      # или обновлении стека.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 143 && nc -z 127.0.0.1 24 && nc -z 127.0.0.1 12345 && nc -z 127.0.0.1 12340"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        # Постоянный адрес — не косметика, а лечение реального дефекта.
        # Postfix обращается к Dovecot за проверкой пароля (SASL) и за квотой,
        # а долгоживущий процесс smtpd запоминает разрешённый адрес. При
        # пересоздании контейнера Dovecot получал новый адрес, Postfix
        # продолжал стучаться по старому, и отправка с аутентификацией падала
        # с «Connection lost to authentication server» — до перезапуска самого
        # Postfix. То есть любое обновление Dovecot ломало отправку письма
        # у пользователя. С постоянным адресом переподключение проходит само.
        ipv4_address: ${DOVECOT_IP:-172.28.0.54}

  # ------------------------------------------------------------------
  # Rspamd — антиспам + DKIM-подпись, milter для Postfix (11332)
  # ------------------------------------------------------------------
  rspamd:
    build: ./rspamd
    container_name: mail-rspamd
    restart: unless-stopped
    # Весь внешний DNS (списки, SPF, DKIM, DMARC) — только через свой резольвер.
    dns:
      - ${RESOLVER_IP:-172.28.0.53}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD}
      # Адрес своего резольвера для встроенного DNS-клиента rspamd
      RESOLVER_IP: ${RESOLVER_IP:-172.28.0.53}
      # Антивирус: по умолчанию выключен (ClamAV с базами ≈ 1 ГБ памяти).
      # Включается вместе с профилем: CLAMAV_ENABLED=true + --profile clamav
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
    volumes:
      - rspamd-data:/var/lib/rspamd
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      # Списки (белые/чёрные) — редактируются админкой на лету, поэтому rw.
      # Rspamd перечитывает карты сам, перезапуск не нужен.
      - ./rspamd/maps.d:/etc/rspamd/maps.d
    ports:
      # Веб-интерфейс/API rspamd (пароль — RSPAMD_PASSWORD)
      - "127.0.0.1:${RSPAMD_WEB_PORT:-11334}:11334"
    depends_on:
      redis:
        condition: service_healthy
      unbound:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11332' "]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # Postfix — SMTP 25 (приём), submission 587 (STARTTLS + SASL),
  # submissions 465 (TLS сразу) — его анонсирует автонастройка клиентов
  # ------------------------------------------------------------------
  postfix:
    build: ./postfix
    container_name: mail-postfix
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME}
    # MX/A-записи и проверки при приёме — через свой резольвер.
    # Имена контейнеров (dovecot, rspamd, postgres) по-прежнему резолвит
    # встроенный DNS Docker, поэтому доставка не зависит от unbound.
    dns:
      - ${RESOLVER_IP:-172.28.0.53}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Постоянный адрес Dovecot попадает в mynetworks: без права слать
      # почту не работают правила «переслать копию» и «автоответчик».
      # Именно один адрес, а не подсеть — рассылать не должен каждый контейнер.
      DOVECOT_IP: ${DOVECOT_IP:-172.28.0.54}
      # Посредник к очереди для админки (см. infra/postfix/queue-agent.pl).
      # Показать очередь, посмотреть письмо, протолкнуть, удалить — больше
      # он не умеет ничего. Порт наружу НЕ публикуется: он доступен только
      # внутри сети стека. Без секрета посредник не запускается вовсе,
      # то есть по умолчанию раздел «Очередь» просто не работает.
      QUEUE_AGENT_TOKEN: ${QUEUE_AGENT_TOKEN:-}
      QUEUE_AGENT_PORT: ${QUEUE_AGENT_PORT:-11345}
    volumes:
      - ./postfix/conf:/etc/postfix-repo:ro
      - ./data/certs:/certs:ro
      # Журналы почтового стека: сюда пишет postlogd, отсюда их читает
      # админка. Сокета Docker у сервера приложения нет и не будет —
      # он означает права root на всей машине.
      - maillogs:/var/log/mail
      # Очередь Postfix — постоянный том, и это обязательно.
      #
      # Без него очередь жила внутри контейнера и исчезала при каждом
      # пересоздании. Проверено: два письма в очереди, `up -d --force-recreate
      # postfix` — и «Mail queue is empty». Отправителям при этом уже сказано
      # «принято», отбойник не придёт никогда, письма просто исчезают.
      # А штатное обновление (`install.sh` делает `up -d --build`) как раз
      # пересоздаёт контейнеры — то есть любое обновление молча теряло всю
      # отложенную почту. У Dovecot тома для писем и индексов сделаны сразу,
      # здесь пропустили.
      - postfix-spool:/var/spool/postfix
    ports:
      - "127.0.0.1:${SMTP_PORT:-25}:25"
      - "127.0.0.1:${SUBMISSION_PORT:-587}:587"
      - "127.0.0.1:${SUBMISSIONS_PORT:-465}:465"
    depends_on:
      postgres:
        condition: service_healthy
      dovecot:
        condition: service_healthy
      rspamd:
        condition: service_started
    healthcheck:
      # Живость мастера по pid-файлу, а НЕ `postfix status`.
      #
      # `postfix status` на каждый вызов пишет в журнал строку «the Postfix
      # mail system is running». При проверке раз в пять секунд это 17 тысяч
      # строк в сутки в том самом журнале, который админка показывает в
      # разделе «Журналы почты» и хранит с ограничением по объёму: полезные
      # записи о доставке вытеснялись бы отчётом проверки о самой себе.
      # Проверяемое условие то же — жив ли процесс master: слушающие порты
      # и все службы Postfix порождает он.
      test: ["CMD-SHELL", "kill -0 $$(cat /var/spool/postfix/pid/master.pid)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # Autoconfig — автоопределение настроек почтовых клиентов:
  # Mozilla Autoconfig, Microsoft Autodiscover, .mobileconfig, DNS-записи
  # ------------------------------------------------------------------
  autoconfig:
    build:
      # Контекст — корень репозитория: сборке нужен tsconfig.base.json
      context: ..
      dockerfile: apps/autoconfig/Dockerfile
    container_name: mail-autoconfig
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      # Каталог DKIM-ключей rspamd (примонтирован ниже read-only)
      DKIM_DNS_DIR: /rspamd/dkim
    volumes:
      # Ключи DKIM генерирует rspamd; autoconfig читает готовую DNS-запись
      - rspamd-data:/rspamd:ro
    ports:
      # Прямой доступ для отладки; клиенты ходят через nginx
      - "127.0.0.1:${AUTOCONFIG_PORT:-8025}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"ok\":true'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # API — сервер приложения: /api/* и WebSocket /ws.
  # Ходит в Dovecot по IMAP от имени пользователя, отправляет через
  # submission Postfix, сессии держит в Redis, настройки — в Postgres.
  # ------------------------------------------------------------------
  api:
    build:
      # Контекст — корень репозитория: это npm workspaces
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: mail-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # Потолок кучи V8. Без него Node считает размер кучи от объёма памяти
      # машины и на сервере с 32 ГБ спокойно занимает 120 МБ там, где хватает
      # 45: сборка мусора просто не спешит. Цель — VPS на 2 ГБ, поэтому
      # потолок задан явно и не зависит от того, где стек запущен.
      # Предел кучи должен вмещать самый большой допустимый запрос.
      #
      # Было 192 МБ при разрешённом теле письма в 12 МБ — и это не просто
      # несогласованность: любой вошедший пользователь ОДНИМ запросом с телом
      # в 4 МБ клал весь сервер приложения. Проверено, воспроизводится втрое:
      # 3 МБ — ответ 200, 4 МБ — «Reached heap limit», процесс перезапускается,
      # у всех остальных обрываются сессии, соединения и отправка.
      #
      # Разбор такого запроса держит в памяти сразу несколько его копий:
      # само тело, разобранную строку, результат проверки схемы. Поэтому
      # запас берётся кратный, а не впритык.
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=512}

      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}

      # Почтовые службы — по именам контейнеров внутри сети стека
      IMAP_HOST: dovecot
      IMAP_PORT: 143
      IMAP_SECURE: "false"
      SMTP_HOST: postfix
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      # Сертификат самоподписанный, а соединение всё равно не выходит
      # за пределы docker-сети. На боевом сервере значение то же:
      # имя контейнера в сертификате Let's Encrypt не значится.
      TLS_REJECT_UNAUTHORIZED: ${TLS_REJECT_UNAUTHORIZED:-false}
      IMAPS_PORT: ${IMAPS_PORT:-993}
      SUBMISSION_PORT: ${SUBMISSION_PORT:-587}

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Кому верить в X-Forwarded-For. Только петля и подсеть стека, где
      # стоит nginx: заголовок подставляет сам клиент, и доверие «всем»
      # означало бы обход ограничения частоты запросов сменой заголовка
      # и любой выдуманный адрес в журнале аудита. Сам nginx этот заголовок
      # перезаписывает (см. infra/nginx/templates/app.conf.template).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,${DOCKER_SUBNET:-172.28.0.0/16}}

      # Секреты только из .env — в открытом виде здесь ничего нет
      SESSION_STORE: redis
      SESSION_SECRET: ${SESSION_SECRET:?нужен SESSION_SECRET в infra/.env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      EXTERNAL_ACCOUNTS_KEY: ${EXTERNAL_ACCOUNTS_KEY:-}
      # На боевом сервере — true (см. install/compose.prod.yml):
      # cookie сессии не должна уходить по открытому HTTP.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Через nginx почта и API живут на одном имени хоста, поэтому CORS
      # нужен только режиму разработки (vite на 5173/5174).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

      # Служебный пользователь Dovecot: вход администратора в чужой ящик
      # и сборщик писем с внешних ящиков
      DOVECOT_MASTER_USER: ${DOVECOT_MASTER_USER:-}
      DOVECOT_MASTER_PASSWORD: ${DOVECOT_MASTER_PASSWORD:-}

      # Перенос почты с чужого сервера (раздел «Перенос почты» в панели).
      # Два ящика одновременно, а не «сколько потянет»: с той стороны чужой
      # сервер, обслуживающий живых людей. Срок в часах — про ПАРОЛИ:
      # они лежат зашифрованными ровно пока идёт задание, и брошенное
      # задание должно когда-то сдаться, а не хранить их бессрочно.
      MIGRATION_CONCURRENCY: ${MIGRATION_CONCURRENCY:-2}
      MIGRATION_MAX_HOURS: ${MIGRATION_MAX_HOURS:-48}

      # Личные правила фильтрации кладутся прямо в почтовое хранилище:
      # том vmail примонтирован, и процесс работает под uid 5000 (vmail),
      # тем же, что у Dovecot. Транспорт docker здесь не годится —
      # docker-сокет внутрь контейнера не пробрасывается и не должен.
      SIEVE_TRANSPORT: ${SIEVE_TRANSPORT:-local}
      SIEVE_ROOT: /var/mail/vhosts

      # Антиспам и свой резольвер — только для сводки состояния админки.
      # Ни то, ни другое не мешает почте ходить при отказе, поэтому в пробу
      # контейнера они не входят; зато остановленный rspamd означает и почту
      # без проверки, и исходящие БЕЗ подписи DKIM — увидеть это можно
      # только в сводке. Пароль контроллера нужен для проверки подписи.
      RSPAMD_HOST: rspamd
      RSPAMD_CONTROLLER_PORT: 11334
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD:-}
      RESOLVER_IP: ${RESOLVER_IP:-}

      # У кого спрашивать DNS при проверке домена в админке.
      # НЕ у unbound выше: тот резольвер наш, и проверка показала бы то,
      # что мы сами себе прописали, а вопрос стоит «видит ли наши записи
      # остальной интернет». Пусто — публичные резольверы по умолчанию
      # (см. PUBLIC_RESOLVERS в apps/api/src/admin/dns.ts).
      DNS_CHECK_RESOLVERS: ${DNS_CHECK_RESOLVERS:-}

      UPLOAD_DIR: /srv/data/uploads

      # Своё оформление входа (OEM): логотип и подписи страниц входа.
      # Обязательно в ТОМЕ, а не внутри образа: логотип должен переживать
      # перезапуск и обновление продукта, а каталог образа при обновлении
      # исчезает. Том api-branding входит и в install/backup.sh, и в копию
      # настроек из панели управления.
      BRANDING_DIR: /srv/branding

      # ------------------------------------------------------------
      # Раздел «Почтовый поток» админки: очередь и журналы.
      #
      # Очередь: посредник внутри контейнера postfix (queue-agent.pl).
      # Секрет общий с ним; пустой означает «раздел очереди недоступен»,
      # и админка честно об этом скажет вместо пустой таблицы.
      #
      # Журналы: общий том, куда пишут postfix, dovecot и сам сервер
      # приложения. Сокет Docker не нужен и не пробрасывается.
      # ------------------------------------------------------------
      MAIL_QUEUE_AGENT_URL: http://postfix:${QUEUE_AGENT_PORT:-11345}
      QUEUE_AGENT_TOKEN: ${QUEUE_AGENT_TOKEN:-}
      MAIL_LOG_DIR: /var/log/mail
      # Своя запись сервера приложения в тот же том (в stdout она идёт
      # по-прежнему). Пусто — не писать файл вовсе.
      API_LOG_FILE: ${API_LOG_FILE:-/var/log/mail/api.log}

      # Сколько хранить разобранную историю доставки. Оба ключа есть в
      # infra/.env.example и оба ЧИТАЮТСЯ кодом (apps/api/src/admin/config.ts),
      # но сюда их забыли пробросить — и правка в .env не делала ничего.
      # Настройка, которая молча не работает, хуже отсутствующей: человек
      # уменьшает срок хранения, видит его в файле и считает вопрос закрытым,
      # а таблица истории продолжает расти по прежним 14 дням.
      MAIL_FLOW_RETENTION_DAYS: ${MAIL_FLOW_RETENTION_DAYS:-14}
      MAIL_FLOW_MAX_ROWS: ${MAIL_FLOW_MAX_ROWS:-500000}

      # Публичный адрес сервера — по нему панель проверяет обратную запись
      # (PTR), без которой крупные почтовые службы отбивают письма ещё на
      # подключении. Установщик определяет адрес и пишет в infra/.env
      # (install/install.sh, шаг «Публичный адрес сервера»), но до контейнера
      # значение не доходило: проверка PTR навсегда оставалась «неизвестно»
      # ровно по той причине, которую установщик уже считал устранённой.
      MAIL_PUBLIC_IPV4: ${MAIL_PUBLIC_IPV4:-}
    volumes:
      - vmail:/var/mail/vhosts
      # Индексы поиска — нужны при удалении ящика: без них уборка оставляла
      # каталог индекса от удалённого пользователя, и такой мусор копился.
      - mailindex:/var/mail/index
      # Временные вложения: файл живёт от загрузки до отправки письма
      - api-uploads:/srv/data
      # Свой логотип страниц входа. Отдельный том, а не подкаталог
      # api-uploads: тот чистится уборщиком по возрасту файлов, и логотип
      # однажды просто исчез бы со страницы входа сам собой.
      - api-branding:/srv/branding
      # Журналы почтового стека — источник разделов «Очередь» и «Журналы».
      # Postfix и Dovecot пишут сюда свои, сервер приложения кладёт свой.
      # Права rw нужны именно ради своего файла; чужие только читаются.
      - maillogs:/var/log/mail
    ports:
      # Прямой доступ для отладки; браузер ходит через nginx
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dovecot:
        condition: service_healthy
    healthcheck:
      # Проба настоящая: краснеет (503), когда недоступно то, без чего
      # продукт не работает (Postgres, Redis, IMAP), — см. apps/api/src/health.ts.
      # Раньше она отвечала {ok:true} безусловно, поэтому десять попыток
      # ничего не стоили. Теперь их три: полторы минуты «всё хорошо» при
      # мёртвом Redis — это полторы минуты, пока прокси шлёт трафик в
      # сервер, который на каждый запрос отвечает ошибкой.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ------------------------------------------------------------------
  # Web — собранный веб-интерфейс почты (статика, отдаётся nginx внутри
  # образа). Наружу не публикуется: снаружи к нему ходит фронтовый nginx.
  # ------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: mail-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # Admin — собранная админка (статика). Тоже только внутри сети.
  # ------------------------------------------------------------------
  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    container_name: mail-admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # Nginx — единственный вход HTTP/HTTPS:
  #   <домен>, mail.<домен>   — почта (web) + /api и /ws (api)
  #   admin.<домен>           — админка (admin) + /api/admin
  #   autoconfig.<домен>,
  #   autodiscover.<домен>    — автонастройка почтовых клиентов
  #   /.well-known/ на корневом домене — она же
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: mail-nginx
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
    volumes:
      # Шаблоны обрабатываются entrypoint-ом образа (envsubst -> conf.d)
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./data/certs:/certs:ro
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:443"
    depends_on:
      autoconfig:
        condition: service_healthy
      # Без готовых приложений nginx поднимать незачем: он их и раздаёт
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      # Через виртуальный хост autoconfig проксируется /healthz сервиса
      test: ["CMD-SHELL", "wget -qO /dev/null --header \"Host: autoconfig.$${MAIL_DOMAIN}\" http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # ClamAV — проверка вложений на вирусы. ВЫКЛЮЧЕН ПО УМОЛЧАНИЮ.
  #
  # Почему: clamd держит сигнатурные базы в памяти — это ~1.2 ГБ RSS плюс
  # ~350 МБ на диске. На VPS с 2 ГБ это больше половины всей памяти, тогда как
  # весь остальной продукт, вместе с веб-интерфейсом, укладывается в ~380 МБ.
  # Поэтому включается осознанно:
  #
  #   1) в infra/.env поставить CLAMAV_ENABLED=true
  #   2) docker compose -f infra/docker-compose.yml --profile clamav up -d
  #
  # Первый запуск скачивает базы (freshclam, ~5–10 минут) — до этого
  # healthcheck красный, а rspamd пишет в лог, что антивирус недоступен;
  # почта при этом продолжает ходить (fail-open, см. local.d/antivirus.conf).
  # ------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4_base
    container_name: mail-clamav
    profiles: ["clamav"]
    restart: unless-stopped
    environment:
      # Отдельный контейнер freshclam не нужен — образ обновляет базы сам
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "2"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

networks:
  # Явная подсеть нужна, чтобы у резольвера был фиксированный адрес
  # (${RESOLVER_IP}) — его подставляем в dns: сервисов и в конфиг rspamd.
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}

volumes:
  pgdata:
  redisdata:
  vmail:
  # Индексы Dovecot + полнотекстовый индекс Xapian
  mailindex:
  rspamd-data:
  # Очередь Postfix: принятые, но ещё не доставленные письма.
  # Без постоянного тома пересоздание контейнера — а его делает любое
  # обновление — молча уничтожало всю отложенную почту.
  postfix-spool:
  # Временные вложения веб-интерфейса (от загрузки до отправки письма)
  api-uploads:
  # Своё оформление входа: логотип OEM и подписи страниц входа.
  # Без постоянного тома логотип пропадал бы при каждом обновлении
  # продукта — а обновление делают чаще, чем меняют логотип.
  api-branding:
  # Журналы почтового стека одним местом: postfix.log, dovecot.log, api.log.
  #
  # Зачем том, если есть `docker compose logs`. Затем, что сервер приложения
  # к нему не имеет доступа: для этого понадобился бы сокет Docker, а он даёт
  # права root на всей машине — платить такую цену за показ журналов нельзя.
  # Файлы в общем томе — единственный способ показать журналы в админке,
  # ничего не открывая наружу. В stdout контейнеров они по-прежнему идут
  # (tail в entrypoint), так что `docker compose logs` работает как раньше.
  maillogs:
  # Базы сигнатур ClamAV (только при профиле clamav)
  clamav-db:
