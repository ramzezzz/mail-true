# Рекурсивный резольвер стека Mail.True.
#
# Смысл: почтовые службы (rspamd, postfix) обязаны резолвить DNS сами, а не
# через 8.8.8.8. Бесплатные списки Spamhaus/URIBL блокируют запросы, пришедшие
# от публичных резольверов, и возвращают 127.255.255.254 вместо реального
# ответа — проверки при этом «работают», но не находят ничего.
#
# Настройки кэшей подобраны под небольшой сервер: RSS порядка 20–30 МБ.

server:
    # ---------------- Сеть ----------------
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no

    # Отвечаем только своей docker-сети и локали. Открытый резольвер в интернет
    # выставлять нельзя — его используют для усиления DDoS.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # Нужно, чтобы можно было направлять stub-зоны на встроенный DNS Docker
    # (127.0.0.11) — см. блоки stub-zone ниже.
    do-not-query-localhost: no

    # ---------------- Права и пути ----------------
    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    pidfile: ""
    use-syslog: no
    logfile: ""
    log-servfail: yes
    # verbosity и log-queries задаёт entrypoint в conf.d/20-logging.conf

    # ---------------- Ресурсы (память) ----------------
    num-threads: 1
    msg-cache-size: 4m
    rrset-cache-size: 8m
    key-cache-size: 2m
    neg-cache-size: 1m
    msg-cache-slabs: 1
    rrset-cache-slabs: 1
    infra-cache-slabs: 1
    key-cache-slabs: 1
    outgoing-range: 462
    num-queries-per-thread: 256
    so-rcvbuf: 0
    so-sndbuf: 0

    # ---------------- Кэширование ----------------
    # DNSBL отдают короткие TTL; поднимаем нижнюю границу, чтобы не долбить
    # списки одинаковыми запросами и не упереться в лимит бесплатного доступа.
    cache-min-ttl: 60
    cache-max-ttl: 3600
    cache-max-negative-ttl: 600
    prefetch: yes
    prefetch-key: yes
    # Если внешний источник вдруг недоступен — отдаём протухший ответ из кэша,
    # чтобы фильтрация не «вставала». Почта важнее свежести DNSBL.
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-client-timeout: 1800

    # ---------------- Безопасность/приватность ----------------
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-large-queries: yes
    hide-identity: yes
    hide-version: yes
    minimal-responses: yes
    rrset-roundrobin: yes
    edns-buffer-size: 1232
    unwanted-reply-threshold: 10000000

    # ---------------- Имена контейнеров ----------------
    # Резольвер rspamd ходит напрямую в unbound, а имена вроде "redis"
    # знает только встроенный DNS Docker (127.0.0.11). Односоставные имена
    # в корне не существуют, поэтому валидацию DNSSEC для них отключаем.
    domain-insecure: "postgres."
    domain-insecure: "redis."
    domain-insecure: "dovecot."
    domain-insecure: "rspamd."
    domain-insecure: "postfix."
    domain-insecure: "clamav."
    domain-insecure: "autoconfig."
    domain-insecure: "nginx."
    domain-insecure: "unbound."

remote-control:
    # unbound-control внутри контейнера: статистика и дамп кэша для
    # infra/test-antispam.sh. Наружу порт не публикуется.
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    control-use-cert: no

# Имена контейнеров docker compose -> встроенный DNS Docker.
stub-zone:
    name: "postgres."
    stub-addr: 127.0.0.11
    stub-prime: no
stub-zone:
    name: "redis."
    stub-addr: 127.0.0.11
    stub-prime: no
stub-zone:
    name: "dovecot."
    stub-addr: 127.0.0.11
    stub-prime: no
stub-zone:
    name: "rspamd."
    stub-addr: 127.0.0.11
    stub-prime: no
stub-zone:
    name: "postfix."
    stub-addr: 127.0.0.11
    stub-prime: no
stub-zone:
    name: "clamav."
    stub-addr: 127.0.0.11
    stub-prime: no
stub-zone:
    name: "autoconfig."
    stub-addr: 127.0.0.11
    stub-prime: no
stub-zone:
    name: "nginx."
    stub-addr: 127.0.0.11
    stub-prime: no
stub-zone:
    name: "unbound."
    stub-addr: 127.0.0.11
    stub-prime: no

# Конфиги, которые генерирует entrypoint (DNSSEC-якорь, логирование)
include: "/etc/unbound/conf.d/*.conf"
