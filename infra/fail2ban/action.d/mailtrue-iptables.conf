# ==================================================================
# Как именно ставится бан: правило пакетного фильтра на ХОСТЕ
# ==================================================================
#
# ------------------------------------------------------------------
# ПОЧЕМУ ЗДЕСЬ СВОЁ ДЕЙСТВИЕ, А НЕ ШТАТНОЕ iptables-allports
# ------------------------------------------------------------------
# Штатное действие fail2ban вставляет правило в цепочку INPUT. Для
# службы, которая слушает порт на самой машине, это правильно. Для
# службы В КОНТЕЙНЕРЕ — нет, и это ровно тот случай, когда защита
# выглядит настроенной и не делает НИЧЕГО:
#
#   пакет из интернета на порт 993
#     -> nat/PREROUTING: Docker подменяет адрес назначения на адрес
#        контейнера (DNAT). Адрес ОТПРАВИТЕЛЯ при этом сохраняется —
#        именно поэтому в журналах Dovecot виден настоящий адрес клиента;
#     -> дальше пакет предназначен не этой машине, а контейнеру,
#        поэтому ядро ведёт его через filter/FORWARD, а НЕ через INPUT;
#     -> правило в INPUT он не встречает никогда.
#
# То есть `fail2ban-client status` показывал бы забаненные адреса,
# `iptables -L` показывал бы правила, а подбор пароля продолжался бы
# как ни в чём не бывало. Худший вид неисправности: тихий.
#
# Правильное место — цепочка DOCKER-USER. Её заводит сам демон Docker и
# гарантирует, что просматривает её ДО собственных правил проброса, —
# она существует ровно для того, чтобы администратор мог ограничить
# доступ к контейнерам, не воюя с правилами, которые Docker переписывает
# при каждом запуске контейнера.
#
# Правило кладётся в ОБЕ цепочки:
#   DOCKER-USER — трафик к контейнерам (почта, веб-интерфейс, панель);
#   INPUT       — трафик к самой машине, если что-то слушает хост.
# Обе вставки необязательные (`|| true`): на машине без Docker цепочки
# DOCKER-USER нет, и это не повод отказываться банить в INPUT.
#
# ------------------------------------------------------------------
# ПОЧЕМУ БАН СРАЗУ НА ВСЕ ПОРТЫ
# ------------------------------------------------------------------
# Правило не привязано к порту намеренно. Тот, кто перебирает пароли по
# IMAP, перебирает их и по SMTP, и на веб-входе — это один и тот же
# перебор по одному и тому же списку ящиков. Банить только тот порт, на
# котором его застали, значит предложить ему перейти на соседний.
#
# ------------------------------------------------------------------
# ПОЧЕМУ REJECT, А НЕ DROP
# ------------------------------------------------------------------
# DROP молчит: соединение просто виснет до истечения таймаута. Для
# переборщика это безразлично (у него сотни адресов), а для человека,
# случайно попавшего под бан, разница огромная: «соединение отклонено»
# сразу — это понятная жалоба в поддержку и понятный ответ, а почтовая
# программа, которая полминуты «подключается» и потом молча ничего не
# показывает, — это день выяснений. Защита от подбора не должна делать
# диагностику невозможной.
# ==================================================================

[Definition]

# Каждый блок ниже выполняется как ОДИН сценарий оболочки, поэтому
# `||` и `;` внутри строки работают, а неудача любой строки без `|| true`
# считается неудачей всего действия.

actionstart = <iptables> -N f2b-<name> 2>/dev/null || true
              <iptables> -A f2b-<name> -j <returntype> 2>/dev/null || true
              <iptables> -C DOCKER-USER -j f2b-<name> 2>/dev/null || <iptables> -I DOCKER-USER 1 -j f2b-<name> 2>/dev/null || true
              <iptables> -C INPUT -j f2b-<name> 2>/dev/null || <iptables> -I INPUT 1 -j f2b-<name> 2>/dev/null || true
              <iptables> -n -L f2b-<name> >/dev/null

actionstop = <iptables> -D DOCKER-USER -j f2b-<name> 2>/dev/null || true
             <iptables> -D INPUT -j f2b-<name> 2>/dev/null || true
             <iptables> -F f2b-<name> 2>/dev/null || true
             <iptables> -X f2b-<name> 2>/dev/null || true

actionflush = <iptables> -F f2b-<name>

# Проверка перед каждым баном: цепочка на месте. Если её снесли
# (перезапуск демона Docker, чужой скрипт, `iptables -F`), fail2ban
# сам выполнит actionstart заново и восстановит все действующие баны.
actioncheck = <iptables> -n -L f2b-<name> >/dev/null

actionban = <iptables> -I f2b-<name> 1 -s <ip> -j <blocktype>

actionunban = <iptables> -D f2b-<name> -s <ip> -j <blocktype>

[Init]

# ВНИМАНИЕ на будущее: fail2ban передаёт сюда параметры port, protocol и
# chain (так устроено штатное `action_` в jail.conf). Это действие их НЕ
# ИСПОЛЬЗУЕТ: цепочки заданы выше жёстко, а бан ставится на все порты
# сразу — см. пояснения в начале файла. Задать `chain=` в jail.local и
# ждать, что правило переедет, не выйдет: параметр молча не при чём.

# -w: ждать общий замок iptables вместо отказа «another app is currently
# holding the xtables lock». Демон Docker переписывает правила при каждом
# запуске контейнера, и без ожидания бан иногда просто не ставился.
iptables = iptables -w
returntype = RETURN
blocktype = REJECT --reject-with icmp-port-unreachable
name = default

[Init?family=inet6]

# Тот же набор для IPv6. Отдельная таблица — имя цепочки может совпадать.
#
# Оговорка про Docker и IPv6: пока в демоне не включён ip6tables,
# подключения по IPv6 к опубликованным портам идут через docker-proxy и
# приходят в контейнер с адресом шлюза сети стека, а не с адресом
# клиента. Забанить такого клиента нельзя в принципе — в журнале его
# адреса нет; зато и спутать его с кем-то нельзя: адрес шлюза лежит в
# белом списке. Об этом сказано в docs/install.md.
iptables = ip6tables -w
blocktype = REJECT --reject-with icmp6-port-unreachable
