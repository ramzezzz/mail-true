# ==================================================================
# Неудачный вход по IMAP / POP3 / ManageSieve (журнал Dovecot)
# ==================================================================
#
# Читает /var/log/mail/dovecot.log — тот самый файл, который пишет
# сам Dovecot (log_path в infra/dovecot/conf/dovecot.conf.template) и
# который показывает раздел «Ящики и доступ» в панели.
#
# ------------------------------------------------------------------
# ПОЧЕМУ НЕ ШТАТНЫЙ ФИЛЬТР dovecot ИЗ КОМПЛЕКТА fail2ban
# ------------------------------------------------------------------
# Штатный фильтр рассчитан на строку из syslog, у которой после даты
# стоит ИМЯ ХОСТА, а затем имя демона. Наш Dovecot пишет в свой файл
# и имени хоста не печатает вовсе:
#
#   Aug 05 20:30:01 imap-login: Info: Disconnected: Aborted login ...
#
# Штатный фильтр на такой строке принял бы «imap-login:» за имя хоста
# и дальше совпал бы или не совпал по случайности — то есть защита от
# подбора работала бы «как повезёт». Свой фильтр описывает ровно тот
# формат, который у нас есть.
#
# ------------------------------------------------------------------
# ЧТО ИМЕННО СЧИТАЕТСЯ ПРОМАХОМ
# ------------------------------------------------------------------
# Только строки завершения сеанса входа со словами «auth failed»:
#
#   imap-login: Info: Disconnected: Aborted login (auth failed, 1 attempts
#     in 2 secs): user=<кто-то@домен>, method=PLAIN, rip=203.0.113.7, ...
#   pop3-login: Info: Aborted login (auth failed, 3 attempts in 6 secs):
#     user=<кто-то@домен>, method=PLAIN, rip=203.0.113.7, ...
#
# Одна такая строка — это ОДНО соединение, в котором могло быть до трёх
# попыток пароля. То есть фильтр считает промахи с недобором, а не с
# перебором: подбирающий доберётся до порога чуть позже, зато человек с
# устаревшим паролем в телефоне — заметно позже. Для защиты, которая
# отрезает адрес от сервера, это правильная сторона ошибки.
#
# ------------------------------------------------------------------
# ЧТО СЮДА НАМЕРЕННО НЕ ПОПАЛО
# ------------------------------------------------------------------
# 1. Подробные строки службы auth («Password mismatch», «unknown user»),
#    которые появляются при auth_verbose = yes. Они точнее считают
#    попытки, но идут В ДОПОЛНЕНИЕ к строке выше — и, посчитав обе,
#    мы бы считали каждый промах дважды, то есть порог «15 попыток»
#    на деле означал бы 7. Кроме того, auth_verbose — настройка, которую
#    могут выключить, и тогда камера ослепла бы молча.
#
# 2. «no auth attempts» — оборванное соединение без единой попытки
#    пароля. Так выглядят сканеры портов и, что важнее, наша собственная
#    проба живости Dovecot: она стучится в 143-й порт раз в полминуты.
#    Ловить это значило бы банить свой же healthcheck.
#
# 3. «tried to use disallowed plaintext auth» — попытка отдать пароль
#    без шифрования. Это не подбор, а неверно настроенная почтовая
#    программа: у человека выключен TLS. Он и так не войдёт; отрезать
#    ему вдобавок весь сервер — наказание не по делу.
# ==================================================================

[Definition]

# Формат даты: «Aug 05 20:30:01» в начале строки (это умолчание Dovecot
# для log_path). Вторым вариантом — ISO, на случай если кто-то поменяет
# log_timestamp: фильтр не должен молча перестать работать из-за этого.
datepattern = {^LN-BEG}%%b %%d %%H:%%M:%%S
              {^LN-BEG}%%Y-%%m-%%d[T ]%%H:%%M:%%S

# `(?:\S+\s+)?(?:dovecot(?:\[\d+\])?:\s+)?` — необязательные имя хоста и
# имя демона: на случай, если журнал когда-нибудь пойдёт через syslog.
# Сейчас их нет, и без «необязательных» фильтр от этого не зависит.
failregex = ^\s*(?:\S+\s+)?(?:dovecot(?:\[\d+\])?:\s+)?(?:imap|pop3|submission|managesieve)-login: (?:Info|Warning|Error): .*\bauth failed\b.*\brip=<HOST>(?:[,\s]|$)

ignoreregex =

[Init]

# Одна строка — одно событие; склеивать соседние строки не нужно.
maxlines = 1
