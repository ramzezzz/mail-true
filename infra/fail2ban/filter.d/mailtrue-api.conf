# ==================================================================
# Неудачный вход в веб-почту и в панель (журнал сервера приложения)
# ==================================================================
#
# Читает /var/log/mail/api.log — журнал сервера приложения. Формат pino:
# одна строка — один объект JSON.
#
# ------------------------------------------------------------------
# ЧТО ИМЕННО ЛОВИТСЯ
# ------------------------------------------------------------------
# Сервер приложения пишет при каждом неудачном входе строку вида:
#
#   {"level":40,"time":1723200000000,"kind":"login.failed",
#    "ip":"203.0.113.7","msg":"Неудачная попытка входа в веб-почту"}
#
# для панели — то же самое с "kind":"admin.login.failed". Пишется это в
# apps/api/src/routes/auth.ts и apps/api/src/admin/routes/auth.ts, рядом
# с записью того же события в базу (история ящика и журнал аудита).
# Записи в базе нужны человеку, эта строка — здешней камере: в базу она
# не ходит и ходить не должна, она умеет следить за файлом.
#
# Уровень warn (40) выбран не для красоты: при NODE_ENV=production в
# api.log не попадает даже строка о самом запросе — журнал запросов там
# отключён намеренно (disableRequestLogging). Неудачный вход обязан
# переживать любую разумную настройку многословности журнала.
#
# Фильтр нарочно нетребователен к деталям, чтобы строка не была «угадай
# написание»: признак события принимается в поле kind, event, action или
# type; адрес — в поле ip, remoteAddress, clientIp или remote_addr;
# порядок полей любой.
#
# Адрес обязан быть тем, который сервер приложения ВЗЯЛ У ДОВЕРЕННОГО
# ПРОКСИ (request.ip при заданном TRUSTED_PROXIES), а не тем, который
# прислал клиент в заголовке. Иначе подбирающий пароль сам выбирает,
# какой адрес забанить, — и первым делом впишет туда чужой.
#
# Камера не единственная защита веб-входа и не отменяет прежние: 10
# попыток в минуту с адреса на /auth/login и запирание пары
# «учётка+адрес» для панели работают независимо от неё. Здешний бан
# отличается тем, что закрывает адресу вообще все порты, а не одну форму.
# ==================================================================

[Definition]

# {NONE} — в строке нет даты, пригодной для разбора: pino пишет время
# числом миллисекунд («"time":1723200000000»), а такое число fail2ban
# датой не считает (и правильно делает — иначе принимал бы за дату любое
# длинное число в строке). При {NONE} временем события считается момент
# ЧТЕНИЯ строки. Для журнала, который читается на лету, это то же самое
# время с точностью до долей секунды.
#
# Единственное следствие: строки, накопившиеся, пока служба не работала,
# после её запуска не разбираются — они все получили бы «сейчас» и
# сложились бы в один мгновенный бан. Для защиты от подбора это неважно:
# она смотрит вперёд, а не назад.
datepattern = {NONE}

failregex = ^\s*\{.*"(?:kind|event|action|type)"\s*:\s*"(?:admin\.)?login\.failed".*"(?:ip|remoteAddress|clientIp|remote_addr)"\s*:\s*"<HOST>".*\}\s*$
            ^\s*\{.*"(?:ip|remoteAddress|clientIp|remote_addr)"\s*:\s*"<HOST>".*"(?:kind|event|action|type)"\s*:\s*"(?:admin\.)?login\.failed".*\}\s*$

ignoreregex =

[Init]

maxlines = 1
