# ==================================================================
# Неудачная аутентификация при отправке (SASL, журнал Postfix)
# ==================================================================
#
# Читает /var/log/mail/postfix.log — файл, который пишет postlogd
# (maillog_file в infra/postfix/conf/main.cf.template) и который
# показывают разделы «Журналы почты» и «Почтовый поток» в панели.
#
# ------------------------------------------------------------------
# ЧТО СЧИТАЕТСЯ ПРОМАХОМ
# ------------------------------------------------------------------
#   Aug  5 20:30:01 mx.example.com postfix/submission/smtpd[42]: warning:
#     unknown[203.0.113.7]: SASL LOGIN authentication failed: UGFzc3dvcmQ6
#
# Такие строки рождают все три точки отправки: 587 (submission),
# 465 (submissions) и 25 (кто-то пробует аутентифицироваться на порту
# приёма почты — само по себе уже примета перебора).
#
# Вторая строка правила — «too many errors after AUTH»: соединение
# оборвано после серии неудачных команд аутентификации. Обычная почтовая
# программа так себя не ведёт никогда; это почерк переборщика.
#
# ------------------------------------------------------------------
# ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ ЭТО ВАЖНО
# ------------------------------------------------------------------
# В строке отказа Postfix НЕ ПЕЧАТАЕТ имя ящика: на момент отказа он не
# считает представленное имя достоверным. Значит, привязать промах к
# конкретному ящику нельзя — и не нужно: банится адрес, а не ящик.
#
# А вот отказ «Connection lost to authentication server» исключён явно
# (ignoreregex ниже). Эта строка означает, что упал НАШ Dovecot, который
# проверяет пароли для Postfix, — отправитель здесь ни при чём. Без
# исключения одна наша авария (перезапуск Dovecot при обновлении)
# заканчивалась бы веерным баном собственных пользователей: у всех, кто
# в этот момент отправлял письмо, отправка отбивается именно так.
# Ровно тот случай, когда защита превращает мелкую неполадку в крупную.
# ==================================================================

[Definition]

# Формат даты — syslog: «Aug  5 20:30:01» (день без ведущего нуля,
# через два пробела). Так пишет postlogd.
datepattern = {^LN-BEG}%%b %%d %%H:%%M:%%S
              {^LN-BEG}%%Y-%%m-%%d[T ]%%H:%%M:%%S

# `\S*smtpd\[\d+\]` покрывает и `postfix/smtpd[42]`, и составные имена
# служб `postfix/submission/smtpd[42]`, `postfix/smtps/smtpd[42]` —
# то есть все точки, где вообще спрашивают пароль.
failregex = ^\s*\S+ \S*smtpd\[\d+\]: warning: [^\[\]]*\[<HOST>\]: SASL (?:[A-Za-z0-9_-]+) authentication failed\b
            ^\s*\S+ \S*smtpd\[\d+\]: too many errors after AUTH from [^\[\]]*\[<HOST>\]

# Отказы, в которых виноваты мы, а не тот, кто подключился.
ignoreregex = SASL [A-Za-z0-9_-]+ authentication failed: (?:Connection lost to authentication server|Temporary authentication failure|generic failure)

[Init]

maxlines = 1
