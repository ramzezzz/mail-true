# Заголовки, которые milter добавляет в письмо (видны в веб-интерфейсе,
# почтовых клиентах и правилах раскладки по папкам).
#
#   spam-header          X-Spam: Yes          — ставится только при действии
#                        «в Спам» и выше; именно по этому заголовку письмо
#                        раскладывается в папку Спам
#   x-spam-status        X-Spam-Status: Yes, score=8.20 required=6.00
#   x-spam-level         X-Spam-Level: ****   — привычный SpamAssassin-стиль
#   x-spamd-bar          X-Spamd-Bar: ++++    — оценка «полосками»
#   x-spamd-result       X-Spamd-Result: перечень сработавших правил с весами;
#                        нужен админке и для разбора жалоб «почему в спам»
#   authentication-results  результаты SPF/DKIM/DMARC
use = ["spam-header", "x-spam-status", "x-spam-level", "x-spamd-bar",
       "x-spamd-result", "authentication-results"];

routines {
    spam-header {
        header = "X-Spam";
        value = "Yes";
        remove = 1;
    }
}

# Штатно модуль не ставит заголовки письмам из «локальных» сетей, а вся
# docker-сеть стека (172.28.0.0/16) попадает под это определение. В проде
# почта приходит из интернета и разница незаметна, а в dev-стенде из-за
# этого письма приходили без пометок. Ставим заголовки всегда.
skip_local = false;

# Письмам своих аутентифицированных пользователей спам-заголовки не нужны —
# оставляем только результаты аутентификации
skip_authenticated = true;
authenticated_headers = ["authentication-results"];
