# Эвристики по имени/адресу отправляющего хоста.
#
# Штатные веса (RDNS_NONE 2.0 + HFILTER_HOSTNAME_UNKNOWN 2.5) дают 4.5 балла
# любому отправителю без обратной DNS-записи. У небольших легитимных серверов
# и у многих корпоративных релеев обратной записи нет, и вместе с парой
# мелочей письмо перескакивало порог 6 — это ровно тот ложный срабатыв,
# от которого договорились защищаться. Оставляем как слабый признак.
symbols = {
    "RDNS_NONE"                { weight = 1.0; }
    "HFILTER_HOSTNAME_UNKNOWN" { weight = 1.0; }
}
