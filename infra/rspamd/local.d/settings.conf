# ------------------------------------------------------------------
# Своя почта между своими — без внешних списков
# ------------------------------------------------------------------
# Письмо от нашего пользователя всегда приходит через submission:587 с
# SASL-аутентификацией (порт 25 аутентификацию не принимает — см.
# infra/postfix/conf/main.cf.template). Значит, «свой отправитель» == прошёл
# аутентификацию. Для таких писем внешние источники репутации не спрашиваем
# вообще: ни один DNS-запрос к спискам не уходит.
#
# Заодно это защищает приватность: без этого правила домены из переписки
# наших пользователей утекали бы в чужие DNS-серверы.
#
# Файл подключается ВНУТРЬ секции settings { ... }, поэтому внешней обёртки
# здесь нет — сразу перечисляем правила.
own_users {
    priority = high;
    authenticated = yes;

    apply {
        # Группы символов, которые ходят во внешний мир
        groups_disabled = [
            "rbl",              # списки адресов отправителей
            "spamhaus",         # zen/dbl.spamhaus.org
            "surbl",            # multi.surbl.org и списки доменов
            "surblorg",
            "uribl",            # multi.uribl.com
            "rspamdbl",         # списки rspamd.com
            "ebl",              # ebl.msbl.org
            "sem",              # spameatingmonkey
            "blocklistde",
            "mailspike",
            "dnswl",            # белый список dnswl.org (тоже внешний)
            "fuzzy",            # коллективная нечёткая база
            "phishing",         # внешние фиды фишинга
            "hfilter",          # эвристики по PTR/HELO отправителя
            "mx"                # проверка MX домена отправителя
        ];

        # Своим пользователям — заметно более мягкие пороги: письмо
        # сотрудника не должно уехать в спам из-за форматирования.
        actions {
            add_header = 12;
            reject = 25;
        }
    }
}
