# Веса списков доменов и ссылок (Spamhaus DBL, URIBL, SURBL, MSBL EBL).
#
# Главное правило: ни один внешний список сам по себе не должен отправлять
# письмо в папку Спам. Порог add_header = 6 (см. local.d/actions.conf),
# поэтому вес любой одиночной сработки держим ниже 6 — чтобы для пометки
# требовалось совпадение хотя бы двух независимых признаков.
# Штатные веса rspamd здесь 6.5–7.5, то есть одной сработки хватало.
symbols = {
    # --- Spamhaus DBL (домены) ---
    "DBL_SPAM"          { weight = 5.0; }
    "DBL_PHISH"         { weight = 5.5; }
    "DBL_MALWARE"       { weight = 5.5; }
    "DBL_BOTNET"        { weight = 5.5; }
    "DBL_ABUSE_PHISH"   { weight = 5.0; }
    "DBL_ABUSE_MALWARE" { weight = 5.0; }
    "DBL_ABUSE_BOTNET"  { weight = 5.0; }
    "URIBL_SBL"         { weight = 5.0; }

    # --- URIBL ---
    "URIBL_BLACK"       { weight = 5.5; }

    # --- SURBL ---
    "PH_SURBL_MULTI"    { weight = 5.5; }
    "MW_SURBL_MULTI"    { weight = 5.5; }
    "ABUSE_SURBL"       { weight = 4.5; }

    # --- MSBL EBL (адреса из тела письма) ---
    "MSBL_EBL"          { weight = 5.5; }

    # Диагностика: список отказался отвечать (запрос пришёл через публичный
    # резольвер или превышен лимит бесплатного доступа). Вес нулевой — это
    # не признак спама, а сигнал администратору, что проверка не работает.
    # Видно в X-Spamd-Result и в веб-интерфейсе rspamd.
    "URIBL_BLOCKED"     { weight = 0.0; }
    "SURBL_BLOCKED"     { weight = 0.0; }
    "DBL_BLOCKED"       { weight = 0.0; }
    "DBL_BLOCKED_OPENRESOLVER" { weight = 0.0; }
}
