# ------------------------------------------------------------------
# БЕЛЫЕ И ЧЁРНЫЕ СПИСКИ (данные лежат в infra/rspamd/maps.d/*.map)
# ------------------------------------------------------------------
# Сами списки — обычные текстовые файлы, по одной записи в строке; строки,
# начинающиеся с #, игнорируются. Каталог примонтирован на запись, поэтому
# админка правит файлы напрямую. Rspamd следит за временем изменения и
# перечитывает карты сам — перезапуск не нужен.
#
# Веса подобраны так, чтобы:
#   • белый список перевешивал типовое ложное срабатывание (6–10 баллов);
#   • чёрный список гарантированно доводил до порога «в Спам» (6), но
#     не до отказа (15) — отказ администратор ставит осознанно, подняв вес.

# ---------------------------- БЕЛЫЕ -------------------------------
WHITELIST_SENDER_ADDRESS {
    type = "from";
    filter = "email:addr";
    map = "/etc/rspamd/maps.d/whitelist_from.map";
    symbol = "WHITELIST_SENDER_ADDRESS";
    score = -10.0;
    description = "Адрес отправителя в белом списке администратора";
}

WHITELIST_SENDER_DOMAIN {
    type = "from";
    filter = "email:domain";
    map = "/etc/rspamd/maps.d/whitelist_domains.map";
    symbol = "WHITELIST_SENDER_DOMAIN";
    score = -6.0;
    description = "Домен отправителя в белом списке администратора";
}

WHITELIST_IP {
    type = "ip";
    map = "/etc/rspamd/maps.d/whitelist_ip.map";
    symbol = "WHITELIST_IP";
    score = -6.0;
    description = "Адрес отправляющего сервера в белом списке администратора";
}

LOCAL_SENDER_DOMAIN {
    # Свои домены: письмо от своего домена не должно выглядеть подозрительным
    # из-за эвристик. Полный отказ от проверок для своих делает
    # local.d/settings.conf — здесь только небольшой минус.
    type = "from";
    filter = "email:domain";
    map = "/etc/rspamd/maps.d/local_domains.map";
    symbol = "LOCAL_SENDER_DOMAIN";
    score = -2.0;
    description = "Отправитель в одном из собственных доменов сервера";
}

# --------------------------- ЧЁРНЫЕ -------------------------------
BLACKLIST_SENDER_ADDRESS {
    type = "from";
    filter = "email:addr";
    map = "/etc/rspamd/maps.d/blacklist_from.map";
    symbol = "BLACKLIST_SENDER_ADDRESS";
    score = 12.0;
    description = "Адрес отправителя в чёрном списке администратора";
}

BLACKLIST_SENDER_DOMAIN {
    type = "from";
    filter = "email:domain";
    map = "/etc/rspamd/maps.d/blacklist_domains.map";
    symbol = "BLACKLIST_SENDER_DOMAIN";
    score = 10.0;
    description = "Домен отправителя в чёрном списке администратора";
}

BLACKLIST_URL_DOMAIN {
    type = "url";
    filter = "tld";
    map = "/etc/rspamd/maps.d/blacklist_url_domains.map";
    symbol = "BLACKLIST_URL_DOMAIN";
    score = 8.0;
    description = "Ссылка на домен из чёрного списка администратора";
}

BLACKLIST_CONTENT {
    # Регулярные выражения по всему письму (заголовки + тело).
    # Сюда же положен стандартный тестовый образец GTUBE: встроенная
    # обработка GTUBE в rspamd отключена (см. local.d/options.inc), потому что
    # она сразу отбивает письмо на SMTP, а нам нужно, чтобы образец прошёл
    # весь конвейер и лёг в папку Спам. Вес 8: выше порога «в Спам» (6),
    # ниже порога отказа (15) даже вместе с обычным «шумом» проверок.
    type = "content";
    filter = "full";
    regexp = true;
    map = "/etc/rspamd/maps.d/blacklist_content.map";
    symbol = "BLACKLIST_CONTENT";
    score = 8.0;
    description = "Совпадение с чёрным списком по содержимому письма";
}
