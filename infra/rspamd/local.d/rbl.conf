# Списки адресов отправителей и списки доменов/ссылок (модуль rbl).
#
# Полный набор правил задан в /usr/share/rspamd/config/modules.d/rbl.conf,
# здесь только то, что меняем. Что реально работает бесплатно:
#
#   zen.spamhaus.org  — адреса отправляющих серверов (SBL/CSS/XBL/PBL/DROP)
#   dbl.spamhaus.org  — домены из ссылок, отправителя, HELO, Reply-To
#   multi.uribl.com   — домены из ссылок
#   multi.surbl.org   — домены из ссылок
#   hashbl.surbl.org  — хэши ссылок и адресов
#   ebl.msbl.org      — адреса отправителей из тела письма
#   list.dnswl.org    — БЕЛЫЙ список известных легитимных серверов
#   bl.blocklist.de, bl.spameatingmonkey.net, bip.virusfree.cz — дополнительные
#   uribl.rspamd.com, email.rspamd.com — списки самого rspamd
#
# ВАЖНО: все они отвечают только своим рекурсивным резольверам. Запрос через
# 8.8.8.8/1.1.1.1 получает 127.255.255.254 («blocked, open resolver») —
# формально ответ есть, фактически проверка не работает. Поэтому в стеке
# поднят unbound (infra/unbound), и rspamd ходит только через него.
#
# Ограничения бесплатного использования — см. docs/antispam.md.

# Для аутентифицированных отправителей (это наши пользователи) внешние списки
# не спрашиваем вообще: они и так «свои». Дублирует local.d/settings.conf,
# но на уровне модуля — чтобы не зависеть от одной настройки.
default_exclude_users = true;

rbls {
    # Списки доменов/ссылок в штатной конфигурации явно ставят
    # exclude_users = false. Возвращаем «не проверять своих».
    SURBL_MULTI       { exclude_users = true; }
    SURBL_HASHBL      { exclude_users = true; }
    URIBL_MULTI       { exclude_users = true; }
    DBL               { exclude_users = true; }
    RSPAMD_URIBL      { exclude_users = true; }
    RSPAMD_EMAILBL    { exclude_users = true; }
    MSBL_EBL          { exclude_users = true; }
    SEM_URIBL_UNKNOWN { exclude_users = true; }

    # Требуют регистрации/платного доступа: незарегистрированным IP всегда
    # отвечают «blocked» независимо от объёма. Держим выключенными явно,
    # чтобы не создавалось впечатление работающей проверки.
    senderscore            { enabled = false; }
    senderscore_reputation { enabled = false; }
}
