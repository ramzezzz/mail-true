# ------------------------------------------------------------------
# ПОРОГИ ФИЛЬТРА (файл редактируется админкой)
# ------------------------------------------------------------------
# Формат строго «имя = значение;» — по одному порогу на строку, без
# вложенности, чтобы админка могла читать и переписывать файл простым
# регулярным выражением.
#
# После изменения применить без простоя:
#   docker compose -f infra/docker-compose.yml kill -s HUP rspamd
#
# Смысл порогов (баллы складываются из всех сработавших правил):
#   add_header — письмо помечается как спам (X-Spam: Yes) и уходит в папку Спам;
#   reject     — приём отклоняется на этапе SMTP: отправитель получает отказ,
#                письмо не теряется молча;
#   greylist   — временный отказ с просьбой повторить (выключен: в dev мешает
#                мгновенной доставке; на боевом сервере разумно около 4);
#   rewrite_subject — префикс в теме; не используем, тему не портим.
#
# Разрыв между add_header и reject сделан большим намеренно: чтобы дойти до
# отказа, нужно несколько независимых сработок, а не одна. Веса отдельных
# внешних списков ограничены в файлах групп рядом — rbl_group.conf,
# surbl_group.conf, fuzzy_group.conf, hfilter_group.conf — так, что ни один
# список в одиночку не дотягивает до add_header. (Файла local.d/groups.conf
# в стеке нет; раньше в этой строке стояло именно оно.)
reject = 15;
add_header = 6;
rewrite_subject = null;
greylist = null;
