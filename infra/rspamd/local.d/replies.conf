# Автоматический белый список корреспондентов.
#
# Модуль запоминает Message-ID писем, отправленных нашими пользователями, и
# когда приходит ответ на такое письмо (In-Reply-To/References), ставит символ
# REPLY с отрицательным весом. Это и есть «белый список тех, с кем пользователь
# переписывается»: он ведётся сам и не требует ручных списков.
#
# Хранилище — Redis (подключение задано в override.d/redis.conf).
# Помним переписку 30 суток (86400 * 30 секунд).
expire = 2592000;
key_prefix = "rr";
symbol = "REPLY";
