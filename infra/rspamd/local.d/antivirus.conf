# ------------------------------------------------------------------
# Проверка вложений на вирусы (ClamAV) — ПО УМОЛЧАНИЮ ВЫКЛЮЧЕНА
# ------------------------------------------------------------------
# Почему выключена: clamd держит сигнатурные базы в оперативной памяти,
# это ~1.2 ГБ RSS. Весь остальной стек занимает ~310 МБ, так что на VPS
# с 2 ГБ антивирус съедает больше половины машины. Решение об этом должен
# принимать администратор, а не установщик по умолчанию.
#
# Как включить (два шага, оба осознанные):
#   1) infra/.env:  CLAMAV_ENABLED=true
#   2) docker compose -f infra/docker-compose.yml --profile clamav up -d
#
# Шаг 1 включает правило ниже (entrypoint пишет override.d/antivirus.conf),
# шаг 2 поднимает сам контейнер clamav. Первый запуск скачивает базы
# (freshclam, 5–10 минут); до этого rspamd пишет в лог, что антивирус
# недоступен, и пропускает письма дальше — почта не встаёт.
# Здесь модуль ВСЕГДА выключен, и это не описка: файл описывает, КАК
# проверять письма, а не включён ли антивирус. Включение делает entrypoint —
# он кладёт этот же файл в override.d с `enabled = true`.
#
# Почему не подстановка переменной окружения прямо здесь. Так и было
# написано — `{= env.CLAMAV_ENABLED =}` — и НЕ РАБОТАЛО: rspamd 4.1 эту
# запись не разворачивает, значение всегда падало в умолчание. То есть
# антивирус нельзя было включить вообще, а два шага из инструкции
# («поставьте true и поднимите профиль») давали работающий контейнер
# clamav, к которому никто не обращался. Поймано живой проверкой:
# `rspamadm configdump antivirus` показывал enabled = false при
# CLAMAV_ENABLED=true в окружении процесса.
enabled = false;

clamav {
    enabled = false;

    type = "clamav";
    servers = "clamav:3310";
    symbol = "CLAM_VIRUS";
    # Найденный вирус — это не «баллы», а однозначный отказ
    action = "reject";
    message = "Вложение содержит вредоносный код: ${SCANNER}: ${VIRUS}";

    # Проверяем только вложения и части MIME, а не текст письма
    scan_mime_parts = true;
    scan_text_mime = false;
    scan_image_mime = false;
    # Файлы больше 20 МБ не проверяем: clamd на них тратит много памяти
    max_size = 20971520;

    # Если clamd не ответил — пропускаем письмо (fail-open). Иначе падение
    # антивируса остановило бы всю входящую почту.
    timeout = 15.0;
    retransmits = 1;

    # Результаты проверки кэшируются в Redis: повторные копии одного письма
    # не гоняются через clamd заново
    prefix = "rs_cl";
    cache_expire = 3600;
}
