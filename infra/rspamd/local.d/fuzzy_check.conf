# Коллективная нечёткая база rspamd.
#
# Что это: публичное хранилище нечётких сигнатур (fuzzy.rspamd.com). Письмо
# разбивается на «шинглы» и сравнивается с тем, что другие серверы уже
# пометили как спам. Хорошо ловит массовые рассылки и устойчиво к мелким
# правкам текста. Правило "rspamd.com" включено в штатной конфигурации;
# здесь фиксируем режим и таймауты.
#
# Бесплатно и без регистрации, но только на чтение (read_only): свои
# сигнатуры в общую базу мы не отправляем, обучать её нельзя.
# Серверы находятся по SRV-записи _fuzzy._tcp.rspamd.com — то есть без
# работающего резольвера правило молча не поднимется.
#
# Ограничение: разумные объёмы, некоммерческий характер. Подробности —
# docs/antispam.md.

# Мелкие части не хэшируем: слишком много ложных совпадений
min_bytes = 1k;
# Если хранилище не отвечает, проверка отваливается за 2 секунды и почта
# идёт дальше — фильтр не должен останавливать доставку.
timeout = 2s;
retransmits = 1;

rule "rspamd.com" {
    read_only = yes;
    skip_unknown = yes;
}
