# Веса списков адресов отправляющих серверов (Spamhaus ZEN и др.).
#
# Как и для списков доменов: одна сработка не должна доводить до порога
# add_header = 6. Штатные веса SBL/XBL — 4.0, PBL/CSS — 2.0, их не трогаем;
# снижаем только DROP-списки, которые шли выше порога.
symbols = {
    "RBL_SPAMHAUS_DROP"      { weight = 5.5; }
    "RECEIVED_SPAMHAUS_DROP" { weight = 5.0; }

    # Диагностика «список отказался отвечать» — вес 0, см. surbl_group.conf
    "SPAMHAUS_BLOCKED"               { weight = 0.0; }
    "SPAMHAUS_BLOCKED_OPENRESOLVER"  { weight = 0.0; }
    "DNSWL_BLOCKED"                  { weight = 0.0; }
}
