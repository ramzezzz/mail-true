<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!--
      Тема ставится ДО первой отрисовки, прямо здесь.

      В разметке стоит светлая тема, а все цвета определены внутри
      `:root[data-theme='…']` — то есть до исполнения приложения страница
      светлая. Скрипт приложения загружается модулем, значит с задержкой:
      на холодном кэше человек с тёмной темой видел белую вспышку во весь
      экран на всё время скачивания. Кэш темы в localStorage применялся до
      первого рендера React, но не до первой отрисовки документа — этой
      разницы и хватало.

      Вставка нарочно крошечная и без зависимостей: читает тот же ключ
      (`mt-theme`), что и приложение, и ставит тот же атрибут. Ошибку
      глушим: приватный режим может запретить хранилище, и падать из-за
      оформления нельзя.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mt-theme');
          // Тем много (свои палитры, парные тёмные варианты), и почти все
          // применяются как есть. Разрешать здесь нужно ровно один случай —
          // «как в системе»; остальное берётся из хранилища без разбора,
          // тем же именем, что ставит приложение.
          if (!saved || saved === 'system') {
            saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = saved;
        } catch (e) {
          /* хранилище недоступно — остаётся светлая тема из разметки */
        }
      })();
    </script>
    <!--
      interactive-widget=resizes-content — из-за него клавиатура телефона
      ужимает саму страницу, а не наезжает на неё. Без этого окно написания
      письма (оно на телефоне во весь экран, position: fixed; inset: 0)
      оставалось прежней высоты, клавиатура вставала поверх, и поле, в которое
      печатают, оказывалось ровно под ней — текст набирался вслепую.
      viewport-fit=cover — чтобы работали env(safe-area-inset-*) у нижней
      полосы папок на телефонах с вырезом.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Почта — Mail.True</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon/favicon.svg" />
    <!-- Фирменные шрифты (Golos Text, JetBrains Mono) — локально, без CDN -->
    <link rel="stylesheet" href="/brand/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
