# Раздача собранного веб-интерфейса почты.
#
# Это внутренний сервис: снаружи в него никто не ходит, все запросы приходят
# от фронтового nginx (infra/nginx). Поэтому здесь только статика, порт 8080
# (непривилегированный — процесс работает не от root) и заголовки кэширования.

worker_processes 1;
# Не root: pid и временные файлы пишем туда, где у пользователя nginx есть права
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Сжатие делаем здесь, а не на фронте: тут лежат сами файлы,
    # фронтовый nginx передаёт уже сжатое тело как есть.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json text/xml application/xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Проверка здоровья контейнера
        location = /healthz {
            # default_type, а не add_header: с add_header получалось два
            # заголовка Content-Type сразу, и фронтовый nginx ругался в журнал
            default_type application/json;
            return 200 '{"ok":true,"service":"web"}';
        }

        # Файлы с хешем в имени (Vite: index-bjZSgkdc.js) не меняются никогда:
        # при новой сборке меняется имя. Их можно кэшировать навсегда.
        location /assets/ {
            # Только Cache-Control: директива expires добавила бы второй,
            # дублирующий заголовок и устаревший Expires
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Шрифты и иконки бренда: имена без хеша, поэтому срок скромнее
        location /brand/ {
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # Точка входа одностраничного приложения. Кэшировать нельзя:
        # именно из index.html берутся ссылки на новые файлы сборки.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
