# Раздача собранной админки Mail.True.
#
# Внутренний сервис: запросы приходят только от фронтового nginx.
# Порт 8080 — непривилегированный, процесс работает не от root.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json text/xml application/xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            # default_type, а не add_header: с add_header получалось два
            # заголовка Content-Type сразу, и фронтовый nginx ругался в журнал
            default_type application/json;
            return 200 '{"ok":true,"service":"admin"}';
        }

        # Имена файлов сборки содержат хеш содержимого — кэшируем навсегда
        location /assets/ {
            # Только Cache-Control: директива expires добавила бы второй,
            # дублирующий заголовок и устаревший Expires
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /brand/ {
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
