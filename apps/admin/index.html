<!doctype html>
<!--
  Тема по умолчанию проставлена прямо в разметке и обязана совпадать с
  DEFAULT_ADMIN_THEME (src/appearance/themeStore.ts): пока грузится модуль,
  страница уже покрашена, и панель не мигает белым перед тем, как стать
  графитовой. Сохранённый выбор применяет initAdminTheme при запуске —
  скриптом в разметке это не сделать, инлайновые скрипты запрещены
  политикой безопасности (script-src 'self').
-->
<html lang="ru" data-theme="graphite" data-theme-kind="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Администрирование — Mail.True</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon/favicon.svg" />
    <!-- Фирменные шрифты (Golos Text, JetBrains Mono) — локально, без CDN.
         Без этой строки админка набиралась Arial, а почта — Golos Text:
         два интерфейса одного продукта выглядели как чужие друг другу. -->
    <link rel="stylesheet" href="/brand/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
