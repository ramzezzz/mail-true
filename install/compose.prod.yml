# Боевое переопределение стека Mail.True.
#
# Основной файл infra/docker-compose.yml рассчитан на машину разработчика:
# все порты опубликованы на 127.0.0.1, чтобы стек не торчал наружу.
# На боевом сервере почтовые порты и веб-порты обязаны слушать все адреса,
# иначе снаружи не подключится ни один почтовый сервер и ни один клиент.
#
# Служебные порты (Postgres, Redis, веб-интерфейс Rspamd, отладочный порт
# autoconfig) намеренно НЕ переопределяются: они остаются на 127.0.0.1.
#
# Применяется вместе с основным файлом:
#   docker compose -f infra/docker-compose.yml -f install/compose.prod.yml up -d
#
# Теги !override заменяют список портов целиком, а не дописывают к нему
# (иначе получилось бы две публикации одного порта: 127.0.0.1:25 и 0.0.0.0:25,
# что даёт «address already in use»). Требуется Docker Compose 2.24 и новее —
# install/install.sh это проверяет.

#
# ------------------------------------------------------------------
# НОМЕРА ПОРТОВ БЕРУТСЯ ИЗ infra/.env, А НЕ ЗАШИТЫ ЗДЕСЬ
# ------------------------------------------------------------------
# Умолчания — стандартные, и на боевом сервере менять их не нужно: чужие
# почтовые серверы стучатся в 25-й, почтовые программы — в 587 и 993, и
# наша же автонастройка называет им эти номера.
#
# Но зашитыми они быть не могут. Раньше были — и получалась ложь: человек
# задавал другие порты (в infra/.env или на шаге «Порты» мастера первого
# запуска), основной файл их слушался, а этот молча возвращал стандартные.
# Второй стенд на той же машине не поднимался вовсе:
#   «Bind for 127.0.0.1:110 failed: port is already allocated»
# — при том, что в настройках стоял совсем другой номер. Поймано живым
# прогоном веб-установщика рядом с работающим стендом.
# ------------------------------------------------------------------
services:
  postfix:
    ports: !override
      - '${BIND_ADDRESS:-0.0.0.0}:${SMTP_PORT:-25}:25' # приём почты от чужих серверов
      - '${BIND_ADDRESS:-0.0.0.0}:${SUBMISSION_PORT:-587}:587' # отправка: submission, STARTTLS + SASL
      # Порт 465 (submissions, TLS сразу) — НЕ «на всякий случай».
      #
      # Его слушает Postfix (infra/postfix/conf/master.cf), его отдаёт
      # автонастройка клиентов (apps/autoconfig: clientConfig, autodiscover,
      # .mobileconfig) и он же напечатан в справке «Настроить почтовую
      # программу». А в этом файле его не было — то есть на БОЕВОМ сервере,
      # и только там, порт не публиковался наружу вовсе.
      #
      # Получалось так: dev-стенд (infra/docker-compose.yml) 465 публикует,
      # значит при разработке всё работает; на сервере же Outlook, почта
      # Apple и Thunderbird получали от нас настройку с портом 465, шли на
      # него и упирались в «соединение отклонено». Причём по НАШЕЙ же выдаче.
      # Единственный дефект, который проявляется исключительно в бою.
      - '${BIND_ADDRESS:-0.0.0.0}:${SUBMISSIONS_PORT:-465}:465' # отправка: submissions, TLS сразу
    logging: &prod-logging
      driver: json-file
      options:
        # Ограничение лога: на VPS с маленьким диском разросшийся json-лог
        # контейнера — вторая по частоте причина «сервер встал» после почты.
        max-size: '10m'
        max-file: '5'

  dovecot:
    ports: !override
      - '${BIND_ADDRESS:-0.0.0.0}:${IMAP_PORT:-143}:143' # IMAP + STARTTLS
      - '${BIND_ADDRESS:-0.0.0.0}:${IMAPS_PORT:-993}:993' # IMAPS
      - '${BIND_ADDRESS:-0.0.0.0}:${POP3_PORT:-110}:110' # POP3 + STARTTLS
      - '${BIND_ADDRESS:-0.0.0.0}:${POP3S_PORT:-995}:995' # POP3S
    logging: *prod-logging

  nginx:
    ports: !override
      - '${BIND_ADDRESS:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80' # ACME + autoconfig/autodiscover
      - '${BIND_ADDRESS:-0.0.0.0}:${NGINX_HTTPS_PORT:-443}:443' # то же по HTTPS (нужно Outlook)
      # Резервный вход в панель по адресу сервера: имя admin.<домен> может
      # быть ещё не разослано, а управлять сервером надо уже сейчас.
      # Слушает ТОЛЬКО локальный адрес (ADMIN_LOCAL_BIND, по умолчанию
      # 127.0.0.1 — то есть снаружи недоступен вовсе).
      - '${ADMIN_LOCAL_BIND:-127.0.0.1}:${ADMIN_LOCAL_PORT:-8081}:8081'
    environment:
      # Cookie сессии отдаётся только по HTTPS (COOKIE_SECURE=true у api),
      # поэтому вход по http невозможен в принципе — перекидываем сразу,
      # не давая человеку упереться в форму, которая принимает пароль и
      # снова показывает форму.
      FORCE_HTTPS: '1'
    logging: *prod-logging

  # Сервер приложения. Наружу не публикуется вовсе: весь HTTP приходит
  # через nginx, поэтому отладочный порт 3000 на боевом сервере не нужен.
  api:
    ports: !override []
    environment:
      # Cookie сессии не должна уходить по открытому HTTP: на боевом
      # сервере вход в почту и админку идёт только по HTTPS.
      COOKIE_SECURE: 'true'
      # Почта, API и админка живут на одном имени хоста каждый —
      # межсайтовые запросы не нужны, и разрешать их незачем.
      CORS_ORIGIN: 'https://${MAIL_DOMAIN},https://mail.${MAIL_DOMAIN},https://admin.${MAIL_DOMAIN}'
      # В журнал попадает адрес клиента из X-Forwarded-For от nginx
      MAIL_PUBLIC_IPV4: '${MAIL_PUBLIC_IPV4:-}'
    logging: *prod-logging

  # Сторож от подбора паролей. Портов не публикует вовсе (у него их нет),
  # поэтому здесь ему нужно ровно одно — предел на размер лога контейнера.
  #
  # Отдельно стоит сказать, что боевого переопределения он НЕ ТРЕБУЕТ:
  # network_mode: host задан в основном файле, потому что без сетевого
  # пространства хоста служба бессмысленна в любом окружении, а не только
  # на боевом сервере. Здесь нет ни портов, ни адресов, которые надо
  # менять при выходе наружу.
  fail2ban:
    logging: *prod-logging

  # Остальные сервисы наружу не публикуются — только ограничиваем логи.
  web:
    logging: *prod-logging
  admin:
    logging: *prod-logging
  postgres:
    logging: *prod-logging
  redis:
    logging: *prod-logging
  rspamd:
    logging: *prod-logging
  unbound:
    logging: *prod-logging
  autoconfig:
    logging: *prod-logging
  # Эти трое оставались с журналом без предела: докер по умолчанию пишет
  # json-file без ротации, а freshclam у clamav обновляет базы несколько
  # раз в сутки и говорит об этом в журнал. На долгоживущей установке это
  # единственное место, где место на диске уходит незаметно.
  service-agent:
    logging: *prod-logging
  clamav:
    logging: *prod-logging
  installer:
    logging: *prod-logging
